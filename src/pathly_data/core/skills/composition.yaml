# Skill fragment composition manifest
#
# Declares which reusable fragment skills each stage skill composes. Keyed by SKILL NAME
# (e.g. team/build), not by flow-state, so a skill reused across flows composes identically.
#
# Resolver contract (implemented in Conv 2, src/pathly_orchestrator/compose.py):
#   assembled prompt = [stage-specific skill body] + [defaults + skill fragments, declared order]
#   - `defaults` apply ONLY to skills present in the `skills:` map below.
#   - A skill ABSENT from `skills:` is loaded raw and unchanged (no fragments, no defaults).
#   - A fragment entry may be a bare string (`feedback-protocol`) or an object with a gate
#     (`{ name: spawn-rules, requires: can_spawn }`); a gated fragment is dropped when the
#     active adapter's capability is false.
#
# Conv 3 converts BOTH skill families (team/* runner + development/* interactive). Each entry
# lands ATOMICALLY with the matching body reduction, so every shared section appears exactly
# once (body OR fragment, never both).

version: 1
fragments_dir: fragments

# Applied to every skill listed in `skills:` (and only those), before that skill's own fragments.
# Only the universal no-op seam is a default; `completion-report` is opted-in per skill because
# development/review and development/test keep their own PASS/FAIL exit models.
defaults:
  - progress-logging

# Map of <skill name> -> { fragments: [...] }.
# Two skill FAMILIES share the same fragments but keep distinct bodies (see IMPLEMENTATION_PLAN
# "development vs team split"):
#   - team/*        runner-only, assembled at runtime by build_prompt() (FSM drives the loop)
#   - development/* installed by pathly-setup as ~/.claude/skills/pathly-*.md (human drives the loop)
# Manifest keys are the core-skills-relative path without ".md" (e.g. "development/build").
# `spawn-rules` is gated on `can_spawn`: dropped for adapters that cannot spawn sub-agents.
blocks:
  full-build:
    - completion-report
    - scout-choreography
    - feedback-protocol
    - { name: spawn-rules, requires: can_spawn }
  lite-build:
    - scout-choreography
  review-strict:
    - scout-choreography
    - { name: spawn-rules, requires: can_spawn }

skills:
  team/build:
    fragments:
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  team/review:
    fragments:
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  team/test:
    fragments:
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - comms-post
  development/build:
    fragments:
      - completion-report
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  development/review:
    fragments:
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  development/test:
    fragments:
      - scout-choreography
      - comms-post

  debug/build:
    fragments:
      - completion-report
      - scout-choreography
      - feedback-protocol
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull

  debug/verify:
    fragments:
      - completion-report
      - scout-choreography
      - comms-post

  fix/build:
    fragments:
      - completion-report
      - scout-choreography

  planning/evaluate:
    fragments:
      - comms-post

  planning/consolidate:
    fragments:
      - comms-post

  # po is dual-mode: interactive (/pathly po) runs the human Q&A; headless (consultation
  # flow) synthesises PO_NOTES.md autonomously. comms-post gives it the board write-back so
  # the PO_NOTES artifact + open questions land on the board for downstream stages.
  planning/po:
    fragments:
      - comms-post

  # Stand up feature boards on demand — a user can spawn a CLI agent and ask it to create
  # one or many features. board-init owns the board-materialization (root-goal) mechanics.
  planning/create-feature:
    no_defaults: true
    fragments:
      - board-init

  planning/plan:
    fragments:
      - { name: task-dag-post, requires: goal_id }
      - artifact-register
      - completion-report

  planning/dag-sketch:
    fragments:
      - { name: board-start-context, requires: goal_id }
      - { name: task-dag-post, requires: goal_id }
      - artifact-register
      - completion-report

  team/plan:
    fragments:
      - completion-report

  team/design:
    fragments:
      - completion-report
      - artifact-register
      - comms-post

  # Consultation-flow artifact producers — previously RAW (they POSTed to the board
  # from their own body). Now agnostic: comms-post owns the board write-back and
  # completion-report owns AGENT_DONE. (unified-cli-finish Phase 1)
  team/architect:
    fragments:
      - completion-report
      - comms-post
  team/research:
    fragments:
      - completion-report
      - comms-post

  # ── Gap 1: silent-skill board write-back ────────────────────────────────────
  # These five were previously loaded raw (no fragments). Adding them to the map
  # gives them the `progress-logging` default plus `comms-post`. Verified safe:
  # explore/debug/retro carry no log-phase prose, and development/design's existing
  # log-phase markers were previously unexplained — the default now covers them.
  development/design:
    fragments:
      - comms-post
  development/explore:
    fragments:
      - comms-post
  development/debug:
    fragments:
      - comms-post
  planning/retro:
    fragments:
      - comms-post
  team/retro:
    fragments:
      - artifact-register
      - comms-post

  # ── Goal executors: loop per-task agents + the single drain-dag agent ───────
  # The loop executor dispatches ONE agent per ready DAG task. Give it the same
  # fragment layer the FSM/team path gets so it narrates progress, posts findings,
  # and writes AGENT_DONE — instead of running blind on the raw task text.
  # (completion-report stays LAST — it owns the "AGENT_DONE is your final act" rule.)
  development/execute-task:
    fragments:
      - comms-post
      - code-query
      - task-progress
      - completion-report
  # drain-dag (single executor) does its board CRUD inline — it IS the drain loop — so it needs
  # no phase logging (a drain loop has no pipeline phases; no_defaults keeps that prose out). It
  # DOES get task-progress so the single agent posts a ▶/✔ status per task it drains — otherwise
  # a headless single-agent run shows no mid-run progress at all. completion-report stays LAST.
  development/drain-dag:
    no_defaults: true
    fragments:
      - code-query
      - task-progress
      - completion-report

  # ── Unified CLI composition: client-side pure-transform actions ──────────────
  # Summary / Analyze / Split are pure transforms (read a source artifact → derive a
  # file). They compose ONLY the two transform fragments (+ the progress-logging
  # default) — never comms-post — so they connect to Pathly through the SAME
  # composition primitive as server actions while writing their result to a file the
  # host polls. See pathly/plans/unified-cli-composition/DESIGN.md.
  development/summarize:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/summarize-gist:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/summarize-detailed:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/analyze:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/split:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
