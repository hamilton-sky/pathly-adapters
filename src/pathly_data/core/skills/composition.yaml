# Skill fragment composition manifest
#
# Declares which reusable fragment skills each stage skill composes. Keyed by SKILL NAME
# (e.g. team/build), not by flow-state, so a skill reused across flows composes identically.
#
# Resolver contract (implemented in Conv 2, src/pathly_orchestrator/compose.py):
#   assembled prompt = [stage-specific skill body] + [defaults + skill fragments, declared order]
#   - `defaults` apply ONLY to skills present in the `skills:` map below.
#   - A skill ABSENT from `skills:` is loaded raw and unchanged (no fragments, no defaults).
#   - A fragment entry may be a bare string (`feedback-protocol`) or an object with a gate
#     (`{ name: spawn-rules, requires: can_spawn }`); a gated fragment is dropped when the
#     active adapter's capability is false.
#
# Conv 3 converts BOTH skill families (team/* runner + development/* interactive). Each entry
# lands ATOMICALLY with the matching body reduction, so every shared section appears exactly
# once (body OR fragment, never both).

version: 1
fragments_dir: fragments

# Applied to every skill listed in `skills:` (and only those), before that skill's own fragments.
# Only the universal no-op seam is a default; `completion-report` is opted-in per skill because
# development/review and development/test keep their own PASS/FAIL exit models.
defaults:
  - progress-logging

# Map of <skill name> -> { fragments: [...] }.
# Two skill FAMILIES share the same fragments but keep distinct bodies (see IMPLEMENTATION_PLAN
# "development vs team split"):
#   - team/*        runner-only, assembled at runtime by build_prompt() (FSM drives the loop)
#   - development/* installed by pathly-setup as ~/.claude/skills/pathly-*.md (human drives the loop)
# Manifest keys are the core-skills-relative path without ".md" (e.g. "development/build").
# `spawn-rules` is gated on `can_spawn`: dropped for adapters that cannot spawn sub-agents.
blocks:
  full-build:
    - completion-report
    - scout-choreography
    - feedback-protocol
    - { name: spawn-rules, requires: can_spawn }
  lite-build:
    - scout-choreography
  review-strict:
    - scout-choreography
    - { name: spawn-rules, requires: can_spawn }

skills:
  team/build:
    fragments:
      - completion-report
      - scout-choreography
      - feedback-protocol
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  team/review:
    fragments:
      - completion-report
      - scout-choreography
      - feedback-protocol
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  team/test:
    fragments:
      - completion-report
      - scout-choreography
      - feedback-protocol
      - comms-post
  development/build:
    fragments:
      - completion-report
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  development/review:
    fragments:
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  development/test:
    fragments:
      - scout-choreography
      - comms-post

  debug/build:
    fragments:
      - completion-report
      - scout-choreography
      - feedback-protocol
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull

  debug/verify:
    fragments:
      - completion-report
      - scout-choreography
      - comms-post

  fix/build:
    fragments:
      - completion-report
      - scout-choreography

  planning/evaluate:
    fragments:
      - comms-post

  planning/consolidate:
    fragments:
      - comms-post

  planning/plan:
    fragments:
      - completion-report

  team/plan:
    fragments:
      - completion-report

  team/design:
    fragments:
      - completion-report
      - comms-post

  # ── Gap 1: silent-skill board write-back ────────────────────────────────────
  # These five were previously loaded raw (no fragments). Adding them to the map
  # gives them the `progress-logging` default plus `comms-post`. Verified safe:
  # explore/debug/retro carry no log-phase prose, and development/design's existing
  # log-phase markers were previously unexplained — the default now covers them.
  development/design:
    fragments:
      - comms-post
  development/explore:
    fragments:
      - comms-post
  development/debug:
    fragments:
      - comms-post
  planning/retro:
    fragments:
      - comms-post
  team/retro:
    fragments:
      - comms-post

  # ── Unified CLI composition: client-side pure-transform actions ──────────────
  # Summary / Analyze / Split are pure transforms (read a source artifact → derive a
  # file). They compose ONLY the two transform fragments (+ the progress-logging
  # default) — never comms-post — so they connect to Pathly through the SAME
  # composition primitive as server actions while writing their result to a file the
  # host polls. See pathly/plans/unified-cli-composition/DESIGN.md.
  development/summarize:
    fragments:
      - client-file-output
      - artifact-transform
  development/analyze:
    fragments:
      - client-file-output
      - artifact-transform
  development/split:
    fragments:
      - client-file-output
      - artifact-transform
