# Skill fragment composition manifest
#
# Declares which reusable fragment skills each stage skill composes. Keyed by SKILL NAME
# (e.g. team/build), not by flow-state, so a skill reused across flows composes identically.
#
# Resolver contract (implemented in Conv 2, src/pathly_orchestrator/compose.py):
#   assembled prompt = [stage-specific skill body] + [defaults + skill fragments, declared order]
#   - `defaults` apply ONLY to skills present in the `skills:` map below.
#   - A skill ABSENT from `skills:` is loaded raw and unchanged (no fragments, no defaults).
#   - A fragment entry may be a bare string (`feedback-protocol`) or an object with a gate
#     (`{ name: spawn-rules, requires: can_spawn }`); a gated fragment is dropped when the
#     active adapter's capability is false.
#
# Conv 3 converts BOTH skill families (team/* runner + development/* interactive). Each entry
# lands ATOMICALLY with the matching body reduction, so every shared section appears exactly
# once (body OR fragment, never both).

version: 1
fragments_dir: fragments

# Applied to every skill listed in `skills:` (and only those), before that skill's own fragments.
# Only the universal no-op seam is a default; `completion-report` is opted-in per skill because
# development/review and development/test keep their own PASS/FAIL exit models.
defaults:
  - progress-logging

# Applied to a skill ABSENT from `skills:` when it is run on a board (POST /comms/run) or in a
# flow — the board-run / flow call sites pass `board_default=True` (see compose_skill). This is
# the "always compose through fragments" guarantee for user-created custom skills: without it a
# custom skill would be handed to the CLI raw and never post its artifacts/progress to the board.
# NOT applied on the build-time install path or editor previews (those keep the skill raw). Board
# CONTEXT injection is separate — it happens at the run level (start_board_run/retrieve_board_context).
board_defaults:
  - progress-logging
  - comms-post

# Map of <skill name> -> { fragments: [...] }.
# Two skill FAMILIES share the same fragments but keep distinct bodies (see IMPLEMENTATION_PLAN
# "development vs team split"):
#   - team/*        runner-only, assembled at runtime by build_prompt() (FSM drives the loop)
#   - development/* installed by pathly-setup as ~/.claude/skills/pathly-*.md (human drives the loop)
# Manifest keys are the core-skills-relative path without ".md" (e.g. "development/build").
# `spawn-rules` is gated on `can_spawn`: dropped for adapters that cannot spawn sub-agents.
blocks:
  full-build:
    - completion-report
    - scout-choreography
    - feedback-protocol
    - { name: spawn-rules, requires: can_spawn }
  lite-build:
    - scout-choreography
  review-strict:
    - scout-choreography
    - { name: spawn-rules, requires: can_spawn }

skills:
  team/build:
    fragments:
      - build-discipline
      - code-query
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  team/review:
    fragments:
      - code-query
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  team/test:
    fragments:
      - code-query
      - artifact-register
      - completion-report
      - scout-choreography
      - feedback-protocol
      - consult
      - comms-post
  development/build:
    fragments:
      - build-discipline
      - code-query
      - completion-report
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - catalog-pull
  development/review:
    fragments:
      - code-query
      - scout-choreography
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull
  development/test:
    fragments:
      - code-query
      - scout-choreography
      - comms-post

  debug/build:
    fragments:
      - build-discipline
      - code-query
      - completion-report
      - scout-choreography
      - feedback-protocol
      - { name: spawn-rules, requires: can_spawn }
      - comms-post
      - catalog-pull

  debug/verify:
    fragments:
      - code-query
      - completion-report
      - scout-choreography
      - comms-post

  fix/build:
    fragments:
      - build-discipline
      - code-query
      - completion-report
      - scout-choreography

  # Board-native emitters: comms-post owns the board write-back; completion-report owns the
  # AGENT_DONE. Without completion-report these runs wrote NO AGENT_DONE, so the invocation
  # projector recorded nothing — they vanished from the Monitor's RECENT list and went unbilled
  # (every other terminal emitter — feature-decompose, project-decompose, dag-sketch — already
  # carries it). start_board_run injects the <fsm_feature>/<feature_path> placeholders it needs.
  planning/evaluate:
    fragments:
      - code-query
      - comms-post
      - completion-report

  planning/consolidate:
    fragments:
      - comms-post
      - completion-report

  # po is dual-mode: interactive (/pathly po) runs the human Q&A; headless (consultation
  # flow) synthesises PO_NOTES.md autonomously. comms-post gives it the board write-back so
  # the PO_NOTES artifact + open questions land on the board for downstream stages.
  planning/po:
    fragments:
      - code-query
      - comms-post

  # Stand up feature boards on demand — a user can spawn a CLI agent and ask it to create
  # one or many features. board-init owns the board-materialization (root-goal) mechanics.
  planning/create-feature:
    no_defaults: true
    fragments:
      - board-init

  planning/plan:
    fragments:
      - code-query
      - { name: task-dag-post, requires: goal_id }
      - artifact-register
      - completion-report

  planning/dag-sketch:
    fragments:
      - { name: board-start-context, requires: goal_id }
      - { name: task-dag-post, requires: goal_id }
      - artifact-register
      - completion-report

  # Terminal emitter for feature → goals decomposition. Posts type=goal siblings to the
  # feature board. One skill covers all tiers: light (standalone), consultation (after PO
  # →architect→researcher→designer write feature artifacts). Board write-back via comms-post;
  # AGENT_DONE via completion-report. no_defaults: no pipeline phases in a terminal emitter.
  planning/feature-decompose:
    no_defaults: true
    fragments:
      - code-query
      - comms-post
      - completion-report

  # Terminal emitter for project → features decomposition. Posts type=feature siblings to the
  # PROJECT board AND materializes pathly/features/<slug>/SPEC.md + each feature's own board
  # (root goal). One skill covers all tiers: light (standalone), consultation (after PO
  # →architect→researcher→designer write project artifacts). Board write-back via comms-post;
  # AGENT_DONE via completion-report. no_defaults: no pipeline phases in a terminal emitter.
  planning/project-decompose:
    no_defaults: true
    fragments:
      - code-query
      - comms-post
      - completion-report

  # Terminal emitter for PRD/BMAD import into the board-native hierarchy. Posts
  # type=feature cards on the project board, type=goal cards on feature boards,
  # scaffolds feature SPEC.md files, and preserves depends_on by returned message_id.
  # no_defaults: no legacy progress phases or conversation-file workflow.
  planning/prd-import:
    no_defaults: true
    fragments:
      - code-query
      - comms-post
      - completion-report

  # Interactive front-door to Board→Goals→Tasks: chat an idea into a goal + its task DAG, then post
  # BOTH on human sign-off. Goal create is in-body (like planning/plan's find-or-create); task
  # posting is the task-dag-post fragment, UNGATED — $GOAL_ID is set at runtime by the goal this
  # skill just created (an interactive run has no goal_id spawn context to gate on). no_defaults:
  # an interactive create action with no pipeline phases.
  planning/goalize:
    no_defaults: true
    fragments:
      - task-dag-post

  team/plan:
    fragments:
      - completion-report

  team/design:
    fragments:
      - code-query
      - scout-choreography
      - completion-report
      - artifact-register
      - comms-post

  # Consultation-flow artifact producers — previously RAW (they POSTed to the board
  # from their own body). Now agnostic: comms-post owns the board write-back and
  # completion-report owns AGENT_DONE. (unified-cli-finish Phase 1)
  team/architect:
    fragments:
      - code-query
      - scout-choreography
      - completion-report
      - comms-post
  team/research:
    fragments:
      - code-query
      - scout-choreography
      - completion-report
      - comms-post

  # ── Gap 1: silent-skill board write-back ────────────────────────────────────
  # These five were previously loaded raw (no fragments). Adding them to the map
  # gives them the `progress-logging` default plus `comms-post`. Verified safe:
  # explore/debug/retro carry no log-phase prose, and development/design's existing
  # log-phase markers were previously unexplained — the default now covers them.
  development/design:
    fragments:
      - comms-post
  development/explore:
    fragments:
      - code-query
      - comms-post
  development/debug:
    fragments:
      - code-query
      - comms-post
  planning/retro:
    fragments:
      - comms-post
  team/retro:
    fragments:
      - artifact-register
      - comms-post

  # ── Goal executors: loop per-task agents + the single drain-dag agent ───────
  # The loop executor dispatches ONE agent per ready DAG task. Give it the board
  # write-back (comms-post findings) + code graph + AGENT_DONE. Per-task progress
  # is NOT a fragment here: the supervisor emits a guaranteed Started/Done/Failed
  # status at claim/complete (scheduler._post_task_status), so an agent-side
  # progress fragment would only duplicate it. no_defaults drops progress-logging
  # too — a per-task agent has no pipeline phases. (completion-report stays LAST.)
  development/execute-task:
    no_defaults: true
    fragments:
      - comms-post
      - code-query
      - completion-report
  # drain-dag (single executor) does its board CRUD inline — it IS the drain loop — so it needs
  # no phase logging (a drain loop has no pipeline phases; no_defaults keeps that prose out).
  # Per-task progress is guaranteed server-side: the drain agent completes each task via
  # /comms/tasks/{claim,complete,fail}, whose handlers post a Started/Done/Failed status
  # (blueprints/comms/_helpers.post_task_status) — no agent-side progress fragment needed.
  development/drain-dag:
    no_defaults: true
    fragments:
      - code-query
      - completion-report

  # ── Unified CLI composition: client-side pure-transform actions ──────────────
  # Summary / Analyze / Split are pure transforms (read a source artifact → derive a
  # file). They compose ONLY the two transform fragments (+ the progress-logging
  # default) — never comms-post — so they connect to Pathly through the SAME
  # composition primitive as server actions while writing their result to a file the
  # host polls. See pathly/plans/unified-cli-composition/DESIGN.md.
  development/summarize:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/summarize-gist:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/summarize-detailed:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/analyze:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
  development/split:
    no_defaults: true
    fragments:
      - client-file-output
      - artifact-transform
