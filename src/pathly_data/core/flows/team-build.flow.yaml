_comments: []
adapter_map:
  BUILDING: claude
  REVIEWING: claude
  TESTING: claude
  default: claude
agent_map:
  BUILDING: team/build
  RETRO: team/retro
  REVIEWING: team/review
  TESTING: team/test
escalation_routing:
  REVIEW_FAILURES: planner
  SCOPE_VIOLATION: planner
  TEST_FAILURES: po
feedback_priority:
- HUMAN_QUESTIONS
- BLOCKED_ON_HUMAN
- REQUIREMENT_GAP
- PLAN_FEEDBACK
- ARCH_FEEDBACK
- DESIGN_FEEDBACK
- REVIEW_FAILURES
- TEST_FAILURES
feedback_routing:
  ACCEPTANCE_QUESTION: po
  ARCH_FEEDBACK: architect
  ARCH_QUESTION: architect
  BLOCKED_ON_HUMAN: human
  DESIGN_FEEDBACK: designer
  DESIGN_QUESTIONS: designer
  HUMAN_QUESTIONS: human
  IMPL_QUESTIONS: planner
  INCOMPLETE_TASKS: builder
  PLAN_FEEDBACK: planner
  PO_QUESTIONS: po
  REFLECT_CRITIQUE: builder
  REQUIREMENT_GAP: po
  REVIEW_FAILURES: builder
  REVIEW_INCOMPLETE: reviewer
  SCOPE_VIOLATION: builder
  TEST_FAILURES: builder
flow: team-build
gates:
  REVIEWING->TESTING:
  - artifact: REVIEW.md
    on_fail: REVIEW_INCOMPLETE.md
    pass_marker: 'RESULT: PASS'
    type: verify_gate
  - on_fail: INCOMPLETE_TASKS.md
    type: require_tasks_done
role_map:
  BUILDING: builder
  RETRO: retro
  REVIEWING: reviewer
  TESTING: tester
scope_gate:
  exempt_prefixes: []
states:
- BUILDING
- REVIEWING
- TESTING
- RETRO
- DONE
storage_path: pathly/{topic}/
transition_actions:
  BUILDING->REVIEWING:
  - message: 'feat: complete building stage'
    skill: commit
  RETRO->DONE:
  - skill: archive-artifacts
transition_rules:
  BUILDING:
    default: REVIEWING
  REVIEWING:
    default: TESTING
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
    on_board_count:
      compare_to: 0
      metric: ready
      next: BUILDING
      op: gt
  TESTING:
    default: RETRO
    on_artifact:
      TEST_FAILURES.md: BUILDING
transitions:
  BUILDING:
  - REVIEWING
  DONE: []
  RETRO:
  - DONE
  REVIEWING:
  - BUILDING
  - TESTING
  TESTING:
  - BUILDING
  - RETRO
version: 1
