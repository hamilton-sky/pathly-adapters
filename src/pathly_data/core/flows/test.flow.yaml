version: 1
flow: test
storage_path: "pathly/features/{topic}/"

states:
  - STORMING
  - PLANNING
  - BUILDING
  - REVIEWING
  - TESTING
  - DONE

transitions:
  STORMING:
    - PLANNING
  PLANNING:
    - BUILDING
  BUILDING:
    - REVIEWING
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - DONE
  DONE: []

agent_map:
  STORMING: team/discover
  PLANNING: team/plan
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
role_map:
  STORMING: discoverer
  PLANNING: planner
  BUILDING: builder
  REVIEWING: reviewer
  TESTING: tester

# Upstream-first priority order for route_feedback when multiple feedback files are open
# at once (smart-fix-routing DESIGN.md ss1.5), enforced via feedback_priority below. Files
# not listed there keep their feedback_routing dict-order position, after every listed file.
feedback_routing:
  HUMAN_QUESTIONS: human
  BLOCKED_ON_HUMAN: human
  REQUIREMENT_GAP: po
  PLAN_FEEDBACK: planner
  ARCH_FEEDBACK: architect
  DESIGN_FEEDBACK: designer
  DESIGN_QUESTIONS: architect
  IMPL_QUESTIONS: planner
  REVIEW_FAILURES: builder
  TEST_FAILURES: builder
  ACCEPTANCE_QUESTION: po

feedback_priority:
  - HUMAN_QUESTIONS
  - BLOCKED_ON_HUMAN
  - REQUIREMENT_GAP
  - PLAN_FEEDBACK
  - ARCH_FEEDBACK
  - DESIGN_FEEDBACK
  - REVIEW_FAILURES
  - TEST_FAILURES

transition_rules:
  PLANNING:
    on_artifact:
      IMPLEMENTATION_PLAN.md: BUILDING
    default: PLANNING
  BUILDING:
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: TESTING
    default: DONE

transition_actions:
  "BUILDING->REVIEWING":
    - skill: commit
      message: "feat: complete building stage"
