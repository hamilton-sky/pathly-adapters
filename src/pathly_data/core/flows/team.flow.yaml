version: 1
flow: team
storage_path: "pathly/plans/{topic}/"

states:
  - IDLE
  - STORMING
  - PLANNING
  - BUILDING
  - REVIEWING
  - TESTING
  - RETRO
  - BLOCKED_ON_HUMAN
  - DONE

transitions:
  IDLE:
    - STORMING
    - PLANNING
    - BUILDING
  STORMING:
    - PLANNING
  PLANNING:
    - BUILDING
  BUILDING:
    - REVIEWING
    - BLOCKED_ON_HUMAN
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - RETRO
  RETRO:
    - DONE
  BLOCKED_ON_HUMAN:
    - BUILDING
    - REVIEWING
    - TESTING
  DONE: []

agent_map:
  STORMING: team/discover
  PLANNING: team/plan
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
  RETRO: team/retro
  BLOCKED_ON_HUMAN: wait

feedback_routing:
  ARCH_FEEDBACK: architect
  REVIEW_FAILURES: builder
  TEST_FAILURES: builder
  IMPL_QUESTIONS: planner
  DESIGN_QUESTIONS: architect
  HUMAN_QUESTIONS: human

transition_rules:
  PLANNING:
    # Guard 4 — artifact gate: planner must produce IMPLEMENTATION_PLAN.md before BUILDING
    on_artifact:
      IMPLEMENTATION_PLAN.md: BUILDING
    default: PLANNING
  BUILDING:
    on_artifact:
      BLOCKED_ON_HUMAN.md: BLOCKED_ON_HUMAN
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
      MORE_CONVS_NEEDED.md: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: TESTING
      BLOCKED_ON_HUMAN.md: BLOCKED_ON_HUMAN
    default: RETRO

transition_actions:
  "BUILDING->REVIEWING":
    - type: git_commit
      message: "feat: complete building stage"
  "RETRO->DONE":
    - type: archive_artifacts
