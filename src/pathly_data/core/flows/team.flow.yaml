version: 1
flow: team
storage_path: pathly/features/{topic}/
states:
  - PLANNING
  - DESIGNING
  - BUILDING
  - REVIEWING
  - TESTING
  - RETRO
  - DONE
transitions:
  PLANNING:
    - DESIGNING
    - PLANNING
  DESIGNING:
    - BUILDING
    - DESIGNING
  BUILDING:
    - REVIEWING
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - RETRO
  RETRO:
    - DONE
  DONE: []
agent_map:
  PLANNING: team/plan
  DESIGNING: team/design
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
  RETRO: team/retro
role_map:
  PLANNING: planner
  DESIGNING: designer
  BUILDING: builder
  REVIEWING: reviewer
  TESTING: tester
  RETRO: retro
feedback_routing:
  HUMAN_QUESTIONS: human
  BLOCKED_ON_HUMAN: human
  REVIEWER_CHANGED_FILES: human  # reviewer_unchanged gate: a reviewer spawn changed files or committed -> a human decides
  REQUIREMENT_GAP: po
  PLAN_FEEDBACK: planner
  ARCH_FEEDBACK: architect
  DESIGN_FEEDBACK: designer
  # The builder's [ARCH] blocker -> architect, the same in every flow (DESIGN_FEEDBACK
  # above is the designer's separate UI/UX file).
  DESIGN_QUESTIONS: architect
  IMPL_QUESTIONS: planner
  REFLECT_CRITIQUE: builder
  REVIEW_INCOMPLETE: reviewer   # REVIEWING->TESTING gate: REVIEW.md missing/not-PASS -> reviewer re-reviews & writes it
  REVIEW_FAILURES: builder
  SCOPE_VIOLATION: builder
  TEST_FAILURES: builder
  ACCEPTANCE_QUESTION: po
  INCOMPLETE_TASKS: builder     # REVIEWING->TESTING gate: require_tasks_done -> finish remaining board tasks
  BUILD_FAILURES: builder       # BUILDING->REVIEWING gate: command_gate (verify.build) exited non-zero
  FLOOR_FAILURES: builder       # floor_gate: the run's diff weakens a test, a check, the config or the plan
  TASK_CHECK_FAILURES: builder  # task_checks: a completed task's check block exited the wrong way
# 3-tier retry escalation (rounds 1-2 owner -> round 3 upstream specialist -> round 4+ human).
# Mirrors team-build.flow.yaml, which shares the same team/review + team/test skills.
escalation_routing:
  REVIEW_FAILURES: planner
  SCOPE_VIOLATION: planner
  TEST_FAILURES: po
# Upstream-first priority order for route_feedback when multiple feedback files are open
# at once (smart-fix-routing DESIGN.md ss1.5) — fix the requirement before the plan before
# the architecture before the design before the code. Files not listed here keep their
# feedback_routing dict-order position, after every listed file.
feedback_priority:
  - HUMAN_QUESTIONS
  - BLOCKED_ON_HUMAN
  - REVIEWER_CHANGED_FILES
  - REQUIREMENT_GAP
  - PLAN_FEEDBACK
  - ARCH_FEEDBACK
  - DESIGN_FEEDBACK
  - REVIEW_FAILURES
  - TEST_FAILURES
transition_rules:
  PLANNING:
    on_content:
      - file: IMPLEMENTATION_PLAN.md
        contains: '## Phase'
        next: DESIGNING
    default: PLANNING
  DESIGNING:
    on_content:
      - file: DESIGN.md
        contains: '## Design System Output'
        next: BUILDING
    default: DESIGNING
  BUILDING:
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
      MORE_CONVS_NEEDED.md: BUILDING
    on_scope_count:
      metric: ready
      op: gt
      compare_to: 0
      next: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: BUILDING
    default: RETRO
transition_actions:
  BUILDING->REVIEWING:
    - skill: commit
      message: 'feat: complete building stage'
  RETRO->DONE:
    - skill: archive-artifacts
scope_gate:
  exempt_prefixes: []
gates:
  BUILDING->REVIEWING:
    - type: verify_gate
      artifact: VERIFY.md
      pass_marker: 'RESULT: PASS'
      on_fail: VERIFY_FAILURES.md
    # Measured counterpart to the self-reported VERIFY.md above: run the project's own
    # build/typecheck command and read its exit code. Skips (fail-open) until
    # `verify.build` is set, so a project that hasn't configured one is unaffected.
    - type: command_gate
      command_key: build
      on_fail: BUILD_FAILURES.md
    # Ground truth for "did it get green honestly": scan the whole run's diff (since the
    # run-wide proof_base) for skipped or deleted tests, silenced linters, lowered thresholds,
    # edited lint/test/CI config and plan edits. FLOOR_FAILURES.md -> builder. The same gate
    # sits on every edge out of REVIEWING, TESTING and into DONE, because a builder fix round
    # runs inside those states while the FSM stays put. A human can allow a category for one
    # claimed task (POST /comms/tasks/floor-allow) or turn it off (setting floor.enabled=false).
    - type: floor_gate
      on_fail: FLOOR_FAILURES.md
    # Ground truth for "is the task done": run the check block of each task a builder completed
    # since the run began, from the text frozen at the claim, and read its exit code.
    # TASK_CHECK_FAILURES.md -> builder. A task whose checks already passed (here or inside the
    # goal-loop drain) is not run again; one completed in a fix round is run at the next join.
    # Tasks without a check block pass.
    - type: task_checks
      on_fail: TASK_CHECK_FAILURES.md
    # The builder stays inside its declared scope: the `files` of the tasks it claimed in this
    # BUILDING plus the paths IMPLEMENTATION_PLAN.md names. Its own feedback files and
    # VERIFY.md are allowed; a plan edit only when a planner/architect SPAWN_WINDOW explains it.
    # Skips when nothing is declared. SCOPE_VIOLATION.md -> builder.
    - type: scope_gate
      scope_file: IMPLEMENTATION_PLAN.md
      on_fail: SCOPE_VIOLATION.md
  # The same check on the failed-review edge, so a reviewer that edited code and then failed the
  # review does not hand that edit to the builder unseen.
  REVIEWING->BUILDING:
    - type: reviewer_unchanged
      on_fail: REVIEWER_CHANGED_FILES.md
  REVIEWING->TESTING:
    # The reviewer writes REVIEW.md (RESULT: PASS) ONLY on a clean pass; a failing review leaves
    # REVIEW_FAILURES.md instead (and deletes any stale REVIEW.md). If REVIEW.md is missing/not-PASS
    # the gate routes to REVIEW_INCOMPLETE.md -> reviewer (NOT human), so a builder-fixed review is
    # RE-REVIEWED before advancing instead of dead-ending the headless run at a human checkpoint.
    - type: verify_gate
      artifact: REVIEW.md
      pass_marker: 'RESULT: PASS'
      on_fail: REVIEW_INCOMPLETE.md
    # Board-DAG completeness: don't advance to TESTING while any of the FEATURE's tasks
    # (across all its goals) are unfinished — this linear pipeline has no single goal_id,
    # so the gate is feature-scoped (board+scope), matching team/build's ready-task fetch.
    - type: require_tasks_done
      on_fail: INCOMPLETE_TASKS.md
    # See BUILDING->REVIEWING: a fix round inside REVIEWING is judged here.
    - type: floor_gate
      on_fail: FLOOR_FAILURES.md
    # See BUILDING->REVIEWING: a task finished by an INCOMPLETE_TASKS fix round is checked here.
    - type: task_checks
      on_fail: TASK_CHECK_FAILURES.md
    # A reviewer judges; it does not edit. Measured from the reviewer's SPAWN_WINDOWs since the
    # run last entered REVIEWING: a changed file other than REVIEW.md / feedback files, or a
    # moved HEAD, parks the run for a human (REVIEWER_CHANGED_FILES.md -> human). Builder fix
    # rounds inside REVIEWING may change code, so only reviewer windows count.
    - type: reviewer_unchanged
      on_fail: REVIEWER_CHANGED_FILES.md
  TESTING->RETRO:
    # The tester agent REPORTS that acceptance criteria pass; this gate MEASURES it by
    # running the project's own test command. A non-zero exit routes the real output to
    # TEST_FAILURES.md -> builder, the same path a tester-authored failure takes.
    - type: command_gate
      command_key: test
      on_fail: TEST_FAILURES.md
    # See BUILDING->REVIEWING: a fix round inside TESTING is judged here, so a skipped test
    # cannot turn the command_gate above green.
    - type: floor_gate
      on_fail: FLOOR_FAILURES.md
  # A DELIVERY flow's DONE is a claim that the feature shipped, so it must not be reachable
  # while board tasks are unfinished. The REVIEWING->TESTING gate above does not cover this:
  # TESTING and RETRO can both post new tasks (a failing acceptance criterion becomes work),
  # and a task re-opened after that gate passed rode straight through to DONE. Wildcard form
  # ("->DONE") so it applies to every inbound edge, not just RETRO's.
  #
  # NOT added to consultation/feature-consultation/project-consultation: those flows END at
  # decomposition, so pending tasks are their correct and expected output, not a lie.
  ->DONE:
    - type: require_tasks_done
      on_fail: INCOMPLETE_TASKS.md
    # See BUILDING->REVIEWING: an INCOMPLETE_TASKS builder fix round inside RETRO is seen by
    # no other floor_gate.
    - type: floor_gate
      on_fail: FLOOR_FAILURES.md
    # See BUILDING->REVIEWING: a task finished inside RETRO is checked here.
    - type: task_checks
      on_fail: TASK_CHECK_FAILURES.md
_comments: []
