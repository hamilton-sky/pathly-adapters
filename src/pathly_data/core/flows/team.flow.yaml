version: 1
flow: team
storage_path: "pathly/plans/{topic}/"
states:
  - STORMING
  - PLANNING
  - DESIGNING
  - BUILDING
  - REVIEWING
  - TESTING
  - RETRO
  - DONE
transitions:
  STORMING:
    - PLANNING
  PLANNING:
    - DESIGNING
    - PLANNING
  DESIGNING:
    - BUILDING
    - DESIGNING
  BUILDING:
    - REVIEWING
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - RETRO
  RETRO:
    - DONE
  DONE: []
agent_map:
  STORMING: team/discover
  PLANNING: team/plan
  DESIGNING: team/design
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
  RETRO: team/retro
role_map:
  STORMING: discoverer
  PLANNING: planner
  DESIGNING: designer
  BUILDING: builder
  REVIEWING: reviewer
  TESTING: tester
  RETRO: retro
# adapter_map (optional): route pipeline stages to different CLI adapters.
# 'default' is required; every value must be in {claude, codex, copilot}.
# Every non-default key must be a declared state in 'states'.
# Omitting this block is fully backward-compatible (preferred_adapter returns "").
# adapter_map:
#   default: claude          # used for any stage not listed below
#   BUILDING: codex          # optional per-state override
#   REVIEWING: claude
feedback_routing:
  HUMAN_QUESTIONS: human
  BLOCKED_ON_HUMAN: human
  ARCH_FEEDBACK: architect
  DESIGN_QUESTIONS: architect
  IMPL_QUESTIONS: planner
  REVIEW_FAILURES: builder
  SCOPE_VIOLATION: builder
  TEST_FAILURES: builder
transition_rules:
  PLANNING:
    on_artifact:
      IMPLEMENTATION_PLAN.md: DESIGNING
    default: PLANNING
  DESIGNING:
    on_artifact:
      DESIGN.md: BUILDING
    default: DESIGNING
  BUILDING:
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
      MORE_CONVS_NEEDED.md: BUILDING   # backwards-compat fallback — one release window
    on_state_counter:
      field: convs_done
      op: lt
      compare_to: convs_total
      next: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: BUILDING
    default: RETRO
transition_actions:
  BUILDING->REVIEWING:
    - skill: commit
      message: 'feat: complete building stage'
  RETRO->DONE:
    - skill: archive-artifacts
scope_gate:
  exempt_prefixes: []
gates:
  BUILDING->REVIEWING:
    - type: verify_gate
      artifact: VERIFY.md
      pass_marker: "RESULT: PASS"
      on_fail: REVIEW_FAILURES.md
    - type: scope_gate
      scope_file: CONVERSATION_PROMPTS.md
      on_fail: SCOPE_VIOLATION.md
  REVIEWING->TESTING:
    - type: require_artifact
      artifact: REVIEW.md
      on_fail: HUMAN_QUESTIONS.md
