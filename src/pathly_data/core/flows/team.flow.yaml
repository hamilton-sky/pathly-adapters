version: 1
flow: team
storage_path: pathly/plans/{topic}/
states:
  - STORMING
  - PLANNING
  - DESIGNING
  - BUILDING
  - REVIEWING
  - TESTING
  - RETRO
  - DONE
transitions:
  STORMING:
    - PLANNING
  PLANNING:
    - DESIGNING
  BUILDING:
    - REVIEWING
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - RETRO
  RETRO:
    - DONE
  DONE: []
  DESIGNING:
    - BUILDING
agent_map:
  STORMING: team/discover
  PLANNING: team/plan
  DESIGNING: team/design
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
  RETRO: team/retro
feedback_routing:
  HUMAN_QUESTIONS: human
  BLOCKED_ON_HUMAN: human
  ARCH_FEEDBACK: architect
  DESIGN_QUESTIONS: architect
  IMPL_QUESTIONS: planner
  REVIEW_FAILURES: builder
  TEST_FAILURES: builder
transition_rules:
  PLANNING:
    on_artifact:
      IMPLEMENTATION_PLAN.md: DESIGNING
    default: PLANNING
  DESIGNING:
    on_artifact:
      DESIGN.md: BUILDING
    default: DESIGNING
  BUILDING:
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
      MORE_CONVS_NEEDED.md: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: TESTING
    default: RETRO
transition_actions:
  BUILDING->REVIEWING:
    - skill: commit
      message: 'feat: complete building stage'
  RETRO->DONE:
    - skill: archive-artifacts
gates:
  BUILDING->REVIEWING:
    - type: verify_gate
      artifact: VERIFY.md
      pass_marker: "RESULT: PASS"
      on_fail: REVIEW_FAILURES.md
  REVIEWING->TESTING:
    - type: require_artifact
      artifact: REVIEW.md
      on_fail: HUMAN_QUESTIONS.md
