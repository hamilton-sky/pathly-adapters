version: 1
flow: team
storage_path: "pathly/plans/{topic}/"

states:
  - STORMING
  - PLANNING
  - BUILDING
  - REVIEWING
  - TESTING
  - RETRO
  - DONE

transitions:
  STORMING:
    - PLANNING
  PLANNING:
    - BUILDING
  BUILDING:
    - REVIEWING
  REVIEWING:
    - BUILDING
    - TESTING
  TESTING:
    - BUILDING
    - RETRO
  RETRO:
    - DONE
  DONE: []

agent_map:
  STORMING: team/discover
  PLANNING: team/plan
  BUILDING: team/build
  REVIEWING: team/review
  TESTING: team/test
  RETRO: team/retro

# Priority order is fixed: HUMAN_QUESTIONS > BLOCKED_ON_HUMAN > ARCH_FEEDBACK >
# DESIGN_QUESTIONS > IMPL_QUESTIONS > REVIEW_FAILURES > TEST_FAILURES.
# HUMAN_QUESTIONS and BLOCKED_ON_HUMAN both route to "human" — the skill surfaces
# the file contents to the user and halts until the file is deleted.
feedback_routing:
  HUMAN_QUESTIONS: human
  BLOCKED_ON_HUMAN: human
  ARCH_FEEDBACK: architect
  DESIGN_QUESTIONS: architect
  IMPL_QUESTIONS: planner
  REVIEW_FAILURES: builder
  TEST_FAILURES: builder

transition_rules:
  PLANNING:
    # Artifact gate: planner must produce IMPLEMENTATION_PLAN.md before BUILDING
    on_artifact:
      IMPLEMENTATION_PLAN.md: BUILDING
    default: PLANNING
  BUILDING:
    default: REVIEWING
  REVIEWING:
    on_artifact:
      REVIEW_FAILURES.md: BUILDING
      MORE_CONVS_NEEDED.md: BUILDING
    default: TESTING
  TESTING:
    on_artifact:
      TEST_FAILURES.md: TESTING
    default: RETRO

transition_actions:
  "BUILDING->REVIEWING":
    - skill: commit
      message: "feat: complete building stage"
  "RETRO->DONE":
    - skill: archive-artifacts
