version: 1
flow: debug
storage_path: pathly/debugs/{topic}/
states:
  - INVESTIGATING
  - REPRODUCING
  - ROOT_CAUSE_FOUND
  - FIXING
  - VERIFYING
  - DONE
transitions:
  INVESTIGATING:
    - REPRODUCING
  REPRODUCING:
    - ROOT_CAUSE_FOUND
  ROOT_CAUSE_FOUND:
    - FIXING
  FIXING:
    - VERIFYING
    - ROOT_CAUSE_FOUND
  VERIFYING:
    - DONE
    - FIXING
agent_map:
  INVESTIGATING: scout
  REPRODUCING: tester
  ROOT_CAUSE_FOUND: README_routing
  FIXING: debug/build
  VERIFYING: debug/verify
role_map:
  INVESTIGATING: scout
  REPRODUCING: tester
  ROOT_CAUSE_FOUND: router
  FIXING: builder
  VERIFYING: reviewer
feedback_routing:
  REPRO_QUESTIONS: human
  TEST_FAILURES: builder
  HUMAN_QUESTIONS: human
  ARCH_FEEDBACK: architect  # rare case: the fix needs a design/architecture change, not just a code fix
transition_actions:
  FIXING->VERIFYING:
    - skill: commit
      message: 'fix: implement fix for {topic}'
  VERIFYING->DONE:
    - skill: archive-artifacts
