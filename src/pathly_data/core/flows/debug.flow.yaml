version: 1
flow: debug
storage_path: pathly/debugs/{topic}/
states:
  - INVESTIGATING
  - REPRODUCING
  - ROOT_CAUSE_FOUND
  - FIXING
  - VERIFYING
  - DONE
transitions:
  INVESTIGATING:
    - REPRODUCING
  REPRODUCING:
    - ROOT_CAUSE_FOUND
  ROOT_CAUSE_FOUND:
    - FIXING
  FIXING:
    - VERIFYING
    - ROOT_CAUSE_FOUND
  VERIFYING:
    - DONE
    - FIXING
agent_map:
  INVESTIGATING: scout
  REPRODUCING: tester
  ROOT_CAUSE_FOUND: README_routing
  FIXING: debug/build
  VERIFYING: debug/verify
role_map:
  INVESTIGATING: scout
  REPRODUCING: tester
  ROOT_CAUSE_FOUND: router
  FIXING: builder
  VERIFYING: reviewer
feedback_routing:
  REPRO_QUESTIONS: human
  # VERIFYING's own skill (debug/verify.md) writes feedback/VERIFY_FAILURES.md when
  # verification fails — this flow's primary failure path. Unrouted, it fell into
  # route_feedback's "Unrecognized feedback file" fallback and escalated to a HUMAN
  # instead of looping VERIFYING -> FIXING (and, on the compiled executor, killed the
  # run outright: a `human` target there is error_kind=human_checkpoint). -> builder,
  # matching quick-fix.flow.yaml's TEST_FAILURES for the same VERIFYING->FIXING edge.
  VERIFY_FAILURES: builder
  TEST_FAILURES: builder
  HUMAN_QUESTIONS: human
  ARCH_FEEDBACK: architect  # rare case: the fix needs a design/architecture change, not just a code fix
# 3-tier retry escalation (rounds 1-2 owner -> round 3 upstream specialist -> round 4+
# human), the same ladder team/team-build/test carry. Without it _resolve_feedback_target
# returns the base agent unconditionally, so a fix that keeps failing verification looped
# back to `builder` forever — no hand-off, no human backstop, just iterations/cost burning
# down. Round 3 goes to `scout` because when the FIX keeps failing, the suspect is the
# DIAGNOSIS above it, and INVESTIGATING (scout) is what produced it — the same
# "upstream cause, not the code" move team.flow.yaml makes with REVIEW_FAILURES -> planner.
escalation_routing:
  VERIFY_FAILURES: scout
  TEST_FAILURES: scout
transition_actions:
  FIXING->VERIFYING:
    - skill: commit
      message: 'fix: implement fix for {topic}'
  VERIFYING->DONE:
    - skill: archive-artifacts
