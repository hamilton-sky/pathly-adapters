# Canonical CLI-engine registry — the ONE source of truth for adapters.
# label/hint feed the Studio selectors (generated into adapters.gen.ts); headless/
# autonomy/resume/parse drive the runner. Regenerate the TS after any edit:
#   python scripts/gen_adapters_ts.py
claude:
  label: Claude
  hint: Claude Code
  terminal_kind: claude
  headless: [claude, "-p", "{prompt}", "--model", "{model}", "--output-format", json]
  autonomy_flag: "--dangerously-skip-permissions"
  resume: {mode: flag, flag: "--resume", arg: "{session_id}"}
  parse: claude_json
codex:
  label: Codex
  hint: OpenAI Codex
  terminal_kind: codex
  headless: [codex, exec, "--sandbox", "workspace-write", "--model", "{model}", "--", "{prompt}"]
  autonomy_flag: null
  resume: {mode: flag, flag: "--continue"}
  parse: codex_json
copilot:
  label: Copilot
  hint: GitHub Copilot
  terminal_kind: shell
  headless: null
  autonomy_flag: null
  resume: null
  parse: null
antigravity:
  label: Gemini
  hint: Antigravity CLI
  terminal_kind: antigravity
  # agy (Antigravity / Gemini CLI) headless one-shot — VERIFIED against agy v1.0.10:
  #   agy -p "<prompt>" --model <gemini-slug> --dangerously-skip-permissions
  # agy has NO --output-format / JSON mode (it prints plain text) and NO --yolo; the
  # unattended auto-approve flag is --dangerously-skip-permissions. --model accepts gemini-*
  # slugs (mapped internally to its display models). Auth is a logged-in `agy` session — no
  # GEMINI_API_KEY needed. Because there is no JSON output, cost/session telemetry is
  # unavailable; the semantic result comes from AGENT_DONE.summary. (`agy --continue`/-c
  # exists if per-session resume is wired later.)
  headless: [agy, "-p", "{prompt}", "--model", "{model}"]
  autonomy_flag: "--dangerously-skip-permissions"
  resume: null
  parse: claude_json
