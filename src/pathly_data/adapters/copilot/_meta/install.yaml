host: copilot
destination: ~/.vscode/extensions/pathly/agents/
files:
  - source: agents/
skills:
  destination: ~/.vscode/extensions/pathly/skills/
  structure: flat
templates:
  destination: ~/.vscode/extensions/pathly/templates
hooks:
  - event: PostToolUse
    script: classify_feedback.py
  - event: PostToolUse
    script: inject_feedback_ttl.py
