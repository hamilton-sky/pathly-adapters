# Primary FSM executor is exposed by pathly_orchestrator.http_server. See orchestrator.md for details.
name: orchestrator
description: Pipeline orchestrator — deterministic filesystem FSM for the feature pipeline. Recovers state from disk, processes one event, emits one next action, and never implements anything itself.
model: gemini-2.5-flash
tools: [Read, Glob, Grep, Write, Edit, Bash]
can_spawn: [quick, "team/plan", "team/build", "team/review", "team/test", "team/retro", "team/discover"]
inputs:
  flow_config:
    description: "Path to a *.flow.yaml file defining the FSM for this run"
    required: true
  topic:
    description: "Feature name, symptom name, or exploration topic — substituted into storage_path"
    required: true
