host: claude
destination: ~/.claude/agents/
files:
  - source: agents/
skills:
  destination: ~/.claude/skills/
  structure: nested
templates:
  destination: ~/.claude/plugins/pathly/templates
telemetry: true
hooks:
  - event: PostToolUse
    script: hooks/classify_feedback.py
  - event: PostToolUse
    script: hooks/inject_feedback_ttl.py
