host: codex
destination: ~/.codex/agents/
files:
  - source: agents/
skills:
  destination: ~/.agents/skills/
  structure: nested
  host_instructions: SKILL_EXECUTION.md
templates:
  destination: ~/.codex/plugins/pathly/templates
plugin:
  destination: ~/.codex/plugins/pathly
  source: .codex-plugin
  include_stitched: true
telemetry: true

codex_agents:
  destination: ~/.codex/agents/
  source: .codex/agents/
  format: toml

codex_config_template:
  destination: ~/.codex/
  source: .codex/config.toml
  note: "Copy to project root .codex/config.toml or global ~/.codex/config.toml"
