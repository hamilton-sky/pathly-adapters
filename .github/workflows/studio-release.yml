name: Build and release Pathly Studio

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_flag: --win
          - os: macos-latest
            eb_flag: --mac
          - os: ubuntu-latest
            eb_flag: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build deps
        run: pip install build

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1

      - name: Install Node deps
        working-directory: studio
        run: npm install

      - name: Ensure resource directories exist
        working-directory: studio
        run: node -e "const fs=require('fs'); fs.mkdirSync('resources/python',{recursive:true}); fs.mkdirSync('resources/wheels',{recursive:true});"

      - name: Prepare resources (bundle Python + wheels)
        working-directory: studio
        run: node scripts/prepare-resources.mjs

      - name: Build renderer
        working-directory: studio
        run: npm run build

      - name: Package and publish (Windows)
        if: runner.os == 'Windows'
        working-directory: studio
        run: npx electron-builder ${{ matrix.eb_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To enable code signing add WIN_CSC_LINK (base64 .pfx) and
          # WIN_CSC_KEY_PASSWORD as GitHub secrets, then uncomment:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package and publish (macOS)
        if: runner.os == 'macOS'
        working-directory: studio
        run: npx electron-builder ${{ matrix.eb_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable keychain auto-discovery — prevents crash when no cert is configured.
          # To enable signing: add MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD secrets and
          # remove the CSC_IDENTITY_AUTO_DISCOVERY line below.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # To enable notarization: add APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID secrets
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package and publish (Linux)
        if: runner.os == 'Linux'
        working-directory: studio
        run: npx electron-builder ${{ matrix.eb_flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
