name: Build and release Pathly Studio

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: studio/dist/*.exe
          - os: macos-latest
            script: build:mac
            artifact: studio/dist/*.dmg
          - os: ubuntu-latest
            script: build:linux
            artifact: studio/dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build deps
        run: pip install build

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1

      - name: Install Node deps
        working-directory: studio
        run: npm ci

      - name: Build Studio installer
        working-directory: studio
        run: npm run ${{ matrix.script }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
