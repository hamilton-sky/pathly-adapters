name: Lint & Type Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Version sync (pyproject.toml = package.json = studio/package.json)
        run: python scripts/check_version_sync.py

      - name: Adapter consistency (dirs = ALLOWED_HOSTS = detect.py = _KNOWN_ADAPTERS)
        run: python scripts/check_adapters.py

      - name: Entry point modules exist
        run: python scripts/check_entry_points.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and audit deps
        run: |
          pip install -e .
          pip install bandit pip-audit
          pip-audit

      - name: Security scan (bandit)
        run: bandit -r src/ -ll -x src/pathly_data/
