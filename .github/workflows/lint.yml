name: Lint & Type Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Version sync (pyproject.toml = package.json = studio/package.json)
        run: python scripts/check_version_sync.py

      - name: Adapter consistency (dirs = ALLOWED_HOSTS = detect.py = _KNOWN_ADAPTERS)
        run: python scripts/check_adapters.py

      - name: Entry point modules exist
        run: python scripts/check_entry_points.py

      - name: No un-sanctioned mirror reads (state-one-authority)
        run: python scripts/check_no_mirror_reads.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and audit deps
        run: |
          pip install -e .
          # pip-audit (unpinned below, so it tracks the latest CVE DB) audits the WHOLE installed
          # env — so a fresh setuptools CVE (e.g. PYSEC-2026-3447 in 79.0.1) fails the job even
          # though setuptools is only the BUILD backend, not a Pathly runtime dep. Resolve it by
          # upgrading the env's setuptools to the current release — NOT by adding a build tool to
          # [project] dependencies (which would force the constraint on every install).
          pip install --upgrade setuptools
          # bandit is pinned so a new release can't add a check and break the job
          # repo-wide (same drift that bit black/mypy). pip-audit stays unpinned so
          # it always audits against the latest CVE database.
          pip install bandit==1.9.4 pip-audit
          pip-audit

      - name: Security scan (bandit)
        run: bandit -r src/ -ll -x src/pathly_data/
