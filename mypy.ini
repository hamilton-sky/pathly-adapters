[mypy]
python_version = 3.11
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = False
warn_return_any = False
exclude = src/pathly_data/

[mypy-fcntl]
ignore_missing_imports = True

# numpy (transitive via sentence-transformers) ships PEP 695 `type` stubs that mypy,
# targeting python_version 3.11 above, rejects with a fatal syntax error while parsing
# numpy/__init__.pyi — aborting the whole run. Skip following into numpy; it is a
# third-party dep we don't type-check anyway.
[mypy-numpy]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
