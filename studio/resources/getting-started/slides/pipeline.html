<!-- @dsCard group="Slides" viewport="1280x720" name="Pipeline slide" subtitle="FSM stages as the hero motif" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; box-sizing:border-box; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:84px 110px; display:flex; flex-direction:column; }
  .kicker { font-size:18px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin:0 0 18px; }
  h2 { font-size:54px; font-weight:700; letter-spacing:-0.02em; margin:0 0 8px; max-width:920px; }
  .sub { font-size:24px; color:var(--text-secondary); margin:0 0 64px; }
  .flow { display:flex; align-items:center; gap:0; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .spill { display:inline-flex; align-items:center; gap:10px; padding:12px 20px; border-radius:var(--radius-full);
    font-size:20px; font-weight:600; letter-spacing:0.03em; border:1.5px solid; }
  .spill .d { width:11px; height:11px; border-radius:50%; }
  .stage .who { font-family:var(--font-family-mono); font-size:15px; color:var(--text-muted); }
  .arrow { flex:1; height:2px; background:var(--border-color); position:relative; margin:0 4px 30px; min-width:34px; }
  .arrow::after { content:''; position:absolute; right:-1px; top:-4px; border-left:8px solid var(--border-color); border-top:5px solid transparent; border-bottom:5px solid transparent; }
  .legend { margin-top:auto; display:flex; gap:28px; font-size:18px; color:var(--text-secondary); }
  .legend b { color:var(--text-primary); font-weight:600; }
</style></head>
<body>
  <div class="slide">
    <p class="kicker">The pipeline</p>
    <h2>A finite-state machine you can watch.</h2>
    <p class="sub">Every feature moves through the same observable stages — each owned by a specialized agent.</p>
    <div class="flow" id="flow"></div>
    <div class="legend">
      <span><b>Forward</b> on gate pass</span>
      <span style="color:var(--orange)"><b style="color:var(--orange)">↩ Reroute</b> on failure</span>
      <span><b>Every transition</b> logged &amp; costed</span>
    </div>
  </div>
  <script>
    var S = [['PLANNING','planner','var(--state-planning)'],['BUILDING','builder','var(--state-building)'],
      ['REVIEWING','reviewer','var(--state-reviewing)'],['TESTING','tester','var(--state-testing)'],['DONE','retro','var(--state-done)']];
    document.getElementById('flow').innerHTML = S.map(function(s,i){
      var pill = '<div class="stage"><span class="spill" style="color:'+s[2]+';border-color:color-mix(in srgb,'+s[2]+' 45%,transparent);background:color-mix(in srgb,'+s[2]+' 12%,transparent)"><span class="d" style="background:'+s[2]+'"></span>'+s[0]+'</span><span class="who">'+s[1]+'</span></div>';
      return pill + (i<S.length-1?'<span class="arrow"></span>':'');
    }).join('');
  </script>
</body></html>
