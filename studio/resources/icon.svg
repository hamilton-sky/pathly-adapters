<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E07535"/>
      <stop offset="100%" style="stop-color:#f4a261"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E07535;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E07535;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="64"  cy="64"  r="2"/><circle cx="128" cy="64"  r="2"/><circle cx="192" cy="64"  r="2"/>
    <circle cx="64"  cy="128" r="2"/><circle cx="128" cy="128" r="2"/><circle cx="192" cy="128" r="2"/>
    <circle cx="64"  cy="192" r="2"/><circle cx="128" cy="192" r="2"/><circle cx="192" cy="192" r="2"/>
  </g>

  <!-- Path lines (arrows) -->
  <!-- Node 1 → Node 2 -->
  <line x1="84" y1="108" x2="128" y2="85" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
  <!-- Node 2 → Node 3 -->
  <line x1="148" y1="85" x2="172" y2="128" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
  <!-- Node 2 → Node 4 -->
  <line x1="148" y1="92" x2="172" y2="148" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Node 1 → bottom -->
  <line x1="78" y1="122" x2="78" y2="162" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Arrowheads -->
  <polygon points="128,78 124,89 132,89" fill="#E07535" opacity="0.7"/>
  <polygon points="176,128 170,120 165,130" fill="#E07535" opacity="0.7"/>

  <!-- Node 1 — entry (left) -->
  <circle cx="72" cy="116" r="20" fill="#0f3460" stroke="#E07535" stroke-width="3"/>
  <circle cx="72" cy="116" r="8" fill="url(#accent)"/>

  <!-- Node 2 — hub (top center) -->
  <circle cx="138" cy="80" r="24" fill="#0f3460" stroke="#E07535" stroke-width="3.5"/>
  <circle cx="138" cy="80" r="10" fill="url(#accent)"/>

  <!-- Node 3 — output A -->
  <circle cx="178" cy="140" r="16" fill="#0f3460" stroke="#E07535" stroke-width="2.5" opacity="0.9"/>
  <circle cx="178" cy="140" r="6" fill="url(#accent)" opacity="0.9"/>

  <!-- Node 4 — output B (faded, branch) -->
  <circle cx="72" cy="172" r="13" fill="#0f3460" stroke="#E07535" stroke-width="2" opacity="0.55"/>
  <circle cx="72" cy="172" r="5" fill="url(#accent)" opacity="0.55"/>

  <!-- "P" lettermark inside hub node -->
  <text x="138" y="84" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif" font-weight="700"
        font-size="13" fill="#1a1a2e" letter-spacing="-0.5">P</text>
</svg>
