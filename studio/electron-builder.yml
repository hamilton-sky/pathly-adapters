appId: com.pathly.studio
productName: Pathly Studio
copyright: Copyright © 2026 Pathly

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

asarUnpack:
  - "node_modules/node-llama-cpp/**/*"

extraResources:
  - from: resources/python
    to: python
    filter: "**/*"
  - from: resources/wheels
    to: wheels
    filter: "*.whl"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  signingHashAlgorithms: [sha256]
  # CSC_LINK and CSC_KEY_PASSWORD read from env (GitHub secret WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD)

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # CSC_LINK / CSC_KEY_PASSWORD read from env (MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD)
  # Notarization: set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID as GitHub secrets
  notarize:
    teamId: ${APPLE_TEAM_ID}

linux:
  target: AppImage
  category: Development

publish:
  provider: github
  owner: hamilton-sky
  repo: pathly-adapters
  releaseType: release
