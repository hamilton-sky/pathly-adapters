<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cell Design — Interactive Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:        #111827;
    --bg-surface0:    #1E2433;
    --bg-surface1:    #283044;
    --bg-surface2:    #2f3a52;
    --text-primary:   #E2E8F0;
    --text-secondary: #A8BBCC;
    --text-muted:     #8899B0;
    --accent:         #38BDF8;
    --green:          #34D399;
    --border:         #283044;
    --font-mono: 'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;
  }

  body {
    background: var(--bg-base);
    background-image: radial-gradient(rgba(136,153,176,0.12) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: var(--font-mono);
    color: var(--text-primary);
    padding: 56px 48px;
    min-height: 100vh;
    user-select: none;
  }

  .hint {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 32px;
    text-align: center;
  }
  .hint span { color: var(--accent); }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 640px;
    margin: 0 auto;
  }

  /* ═══════════ CELL ═══════════ */
  .cell {
    position: relative;
    background: var(--bg-surface0);
    border: 1.5px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    border-radius: 8px;
    padding: 22px 16px 16px;
    cursor: pointer;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .cell.body-type {
    border-color: color-mix(in srgb, var(--green) 22%, var(--border));
  }
  .cell.selected {
    border-color: var(--accent);
    box-shadow:
      0 0 0 1px  color-mix(in srgb, var(--accent) 22%, transparent),
      0 0 18px 0 color-mix(in srgb, var(--accent) 30%, transparent),
      0 -5px 18px -4px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .cell.selected.body-type {
    border-color: var(--green);
    box-shadow:
      0 0 0 1px  color-mix(in srgb, var(--green) 22%, transparent),
      0 0 18px 0 color-mix(in srgb, var(--green) 30%, transparent),
      0 -5px 18px -4px color-mix(in srgb, var(--green) 50%, transparent);
  }

  /* ═══════════ STRIP — badge + icons sit ON the border ═══════════ */
  .strip {
    position: absolute;
    top: 0;
    right: 10px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 1px;
    background: var(--bg-surface0);
    padding: 2px 5px;
    /* border matches the cell's dim accent border */
    border: 1.5px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    border-radius: 7px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .cell.body-type .strip {
    border-color: color-mix(in srgb, var(--green) 22%, var(--border));
  }
  /* selected — strip border brightens + glows to match cell */
  .cell.selected .strip {
    border-color: var(--accent);
    box-shadow:
      0 0 8px 0 color-mix(in srgb, var(--accent) 40%, transparent),
      0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .cell.selected.body-type .strip {
    border-color: var(--green);
    box-shadow:
      0 0 8px 0 color-mix(in srgb, var(--green) 40%, transparent),
      0 0 0 1px color-mix(in srgb, var(--green) 20%, transparent);
  }

  /* type badge */
  .badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-radius: 5px;
    padding: 3px 8px;
    margin-right: 6px;
    line-height: 1;
  }
  .cell.body-type .badge {
    color: var(--green);
    border-color: color-mix(in srgb, var(--green) 35%, transparent);
    background: color-mix(in srgb, var(--green) 12%, transparent);
  }

  /* separator */
  .sdiv {
    width: 1px; height: 14px;
    background: var(--bg-surface2);
    margin: 0 3px;
    flex-shrink: 0;
  }

  /* icon button — bigger, Pathly-sized */
  .act {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    border: none; background: transparent;
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s, color 0.12s;
  }
  .act:hover  { background: var(--bg-surface2); color: var(--text-primary); }
  .act.active { color: var(--accent); }

  /* lucide SVGs — 15px rendered size, 24x24 viewBox */
  .act svg { width: 15px; height: 15px; display: block; }

  /* ═══════════ CONTENT ═══════════ */
  .cell-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 9px;
    line-height: 1.3;
  }

  .cell-rendered {
    font-size: 12px;
    line-height: 1.8;
    color: var(--text-secondary);
    user-select: text;
  }
  .cell-rendered h1,.cell-rendered h2,.cell-rendered h3 {
    font-size: 13px; font-weight: 700;
    color: var(--text-primary); margin-bottom: 8px;
  }
  .cell-rendered p { margin-bottom: 5px; }
  .cell-rendered p:last-child { margin-bottom: 0; }
  .cell-rendered ol,.cell-rendered ul { padding-left: 18px; margin-bottom: 5px; }
  .cell-rendered li { margin-bottom: 3px; }
  .cell-rendered code {
    background: var(--bg-surface1); border-radius: 3px;
    padding: 1px 5px; font-size: 11px; color: var(--accent);
    font-family: var(--font-mono);
  }
  .cell-rendered strong { color: var(--text-primary); font-weight: 600; }

  /* edit textarea */
  .cell-editor {
    display: none;
    width: 100%;
    background: var(--bg-surface1);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    padding: 10px 12px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    user-select: text;
    transition: border-color 0.12s;
  }
  .cell-editor:focus {
    border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
  }
  .cell.editing .cell-rendered { display: none; }
  .cell.editing .cell-editor   { display: block; }
</style>
</head>
<body>

<p class="hint">Click cell to <span>select</span> · Click <span>✎ pencil</span> to edit</p>

<div class="stack">

  <!-- cell 1 -->
  <div class="cell"
       data-title="back"
       data-raw="Roll back the FSM one state with confirmation. Does not undo git commits.">
    <div class="strip">
      <span class="badge">System</span>
      <!-- ChevronUp -->
      <button class="act btn-up" title="Move up" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <!-- ChevronDown -->
      <button class="act btn-down" title="Move down" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sdiv"></div>
      <!-- Pencil -->
      <button class="act btn-edit" title="Edit" onclick="toggleEdit(event,this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <!-- MoreHorizontal -->
      <button class="act btn-more" title="More" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="cell-title"></div>
    <div class="cell-rendered"></div>
    <textarea class="cell-editor"></textarea>
  </div>

  <!-- cell 2 -->
  <div class="cell"
       data-title="## Runtime"
       data-raw="Run: `pathly-back $ARGUMENTS`\n\nPrint the output exactly as returned.\n\nIf command not found: print &quot;Run pathly-setup first to install Pathly CLI tools.&quot;">
    <div class="strip">
      <span class="badge">System</span>
      <button class="act btn-up" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="act btn-down" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sdiv"></div>
      <button class="act btn-edit" onclick="toggleEdit(event,this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button class="act btn-more" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="cell-title"></div>
    <div class="cell-rendered"></div>
    <textarea class="cell-editor"></textarea>
  </div>

  <!-- cell 3 — body type -->
  <div class="cell body-type"
       data-title="## Responsibilities"
       data-raw="1. Accept free-form user requests.\n2. Inspect current project state before routing.\n3. Classify the request:\n   – new feature · resume existing work · tiny direct change">
    <div class="strip">
      <span class="badge">Body</span>
      <button class="act btn-up" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="act btn-down" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sdiv"></div>
      <button class="act btn-edit" onclick="toggleEdit(event,this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button class="act btn-more" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="cell-title"></div>
    <div class="cell-rendered"></div>
    <textarea class="cell-editor"></textarea>
  </div>

  <!-- cell 4 — body empty -->
  <div class="cell body-type"
       data-title="New section"
       data-raw="">
    <div class="strip">
      <span class="badge">Body</span>
      <button class="act btn-up" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button class="act btn-down" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sdiv"></div>
      <button class="act btn-edit" onclick="toggleEdit(event,this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button class="act btn-more" onclick="event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
    <div class="cell-title">New section</div>
    <div class="cell-rendered" style="color:var(--text-muted);font-style:italic;font-size:11px">Empty cell</div>
    <textarea class="cell-editor"></textarea>
  </div>

</div>

<script>
  function renderMd(raw) {
    if (!raw) return '';
    const lines = raw.split('\n');
    let html = '', inOl = false, inUl = false;
    const close = () => {
      if (inOl) { html += '</ol>'; inOl = false; }
      if (inUl) { html += '</ul>'; inUl = false; }
    };
    const inline = s => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    for (const line of lines) {
      const h = line.match(/^(#{1,3})\s+(.+)/);
      const ol = line.match(/^\d+\.\s+(.*)/);
      const ul = line.match(/^[\s]*[-–•]\s+(.*)/);
      if (h)  { close(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
      else if (ol) { if (!inOl) { close(); html += '<ol>'; inOl = true; } html += `<li>${inline(ol[1])}</li>`; }
      else if (ul) { if (!inUl) { close(); html += '<ul>'; inUl = true; } html += `<li>${inline(ul[1])}</li>`; }
      else { close(); const t = inline(line.trim()); if (t) html += `<p>${t}</p>`; }
    }
    close();
    return html;
  }

  document.querySelectorAll('.cell').forEach(cell => {
    const rawTitle = cell.dataset.title || '';
    const rawBody  = (cell.dataset.raw || '').replace(/\\n/g, '\n');
    const titleEl  = cell.querySelector('.cell-title');
    const rendered = cell.querySelector('.cell-rendered');
    const editor   = cell.querySelector('.cell-editor');

    if (titleEl && !titleEl.textContent.trim())
      titleEl.textContent = rawTitle.replace(/^#{1,3}\s+/, '');

    rendered.innerHTML = renderMd(rawBody);
    editor.value = rawBody;

    cell.addEventListener('click', () => {
      const was = cell.classList.contains('selected');
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
      if (!was) cell.classList.add('selected');
    });

    editor.addEventListener('blur', () => {
      rendered.innerHTML = renderMd(editor.value);
      cell.classList.remove('editing');
      cell.querySelector('.btn-edit').classList.remove('active');
    });
    editor.addEventListener('click', e => e.stopPropagation());
  });

  function toggleEdit(e, btn) {
    e.stopPropagation();
    const cell   = btn.closest('.cell');
    const editor = cell.querySelector('.cell-editor');
    if (cell.classList.contains('editing')) {
      cell.querySelector('.cell-rendered').innerHTML = renderMd(editor.value);
      cell.classList.remove('editing');
      btn.classList.remove('active');
    } else {
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
      cell.classList.add('editing', 'selected');
      btn.classList.add('active');
      editor.focus();
    }
  }
</script>
</body>
</html>
