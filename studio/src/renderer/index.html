<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathly Studio</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; font-family: var(--font-family-base); font-size: var(--font-size-base); }
      #root { height: 100vh; }
      .pathly-btn:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
      .pathly-input:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        :root { --transition-base: 0ms; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
