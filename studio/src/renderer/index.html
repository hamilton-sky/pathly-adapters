<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathly Studio</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; font-family: var(--font-family-base); font-size: var(--font-size-base); }
      #root { height: 100vh; }
      .pathly-btn:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
      .pathly-input:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        :root { --transition-base: 0ms; }
      }
      /* ── Global thin scrollbars ── */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--bg-surface1, #343452); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted, #5a5d8a); }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
