    <rect x="22" y="10" width="98" height="7" fill="#1A2233"/>

    <rect x="57" y="12.5" width="5" height="2" rx="1" fill="#34D399"/>
    <rect x="64" y="12.5" width="5" height="2" rx="1" fill="#38BDF8"/>
    <rect x="71" y="12.5" width="5" height="2" rx="1" fill="#313C52"/>
    <rect x="78" y="12.5" width="5" height="2" rx="1" fill="#313C52"/>
    <rect x="105" y="12" width="6" height="3" rx="1" fill="#38BDF8" opacity=".7"/>
    <rect x="113" y="12" width="4" height="3" rx="1" fill="#F87171" opacity=".7"/>
    <!-- notebook cells -->
    <rect x="24" y="20" width="66" height="8" rx="2" fill="#1E2433"/>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.js" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="notebook-directions.jsx"></script>
<script type="text/babel" src="monitor-directions.jsx"></script>
<script type="text/babel" src="chat-settings.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
const W = 1180, H = 760;

function App() {
  return (
    <DesignCanvas>
      {/* ===== NOTEBOOK ===== */}
      <DCSection id="notebook" title="Notebook"
        subtitle="3 directions — all keep existing cell engine, add: arrows-only reorder · hover select-to-cell · import split confirm">
        <DCArtboard id="nb-v1" label="V1 · Evolved Colab — two-pane" width={W} height={H}>
          <NotebookV1 />
          <DCPostIt top={145} left={370} rotate={-2} width={210}>
            ⋮ per-cell menu: copy / duplicate / change type / delete. Selected text shows "New cell from selection" hover bubble.
          </DCPostIt>
        </DCArtboard>
        <DCArtboard id="nb-v2" label="V2 · Document focus + import dialog" width={W} height={H}>
          <NotebookV2 />
          <DCPostIt top={100} left={220} rotate={-2} width={220}>
            Single centred column; preview slides in from the right. Import .md shows a split preview — confirm split into cells or insert as one.
          </DCPostIt>
        </DCArtboard>
        <DCArtboard id="nb-v3" label="V3 · Split inspector (Preview / Cell props / Override diff)" width={W} height={H}>
          <NotebookV3 />
          <DCPostIt top={110} right={240} rotate={2} width={220}>
            Right rail = tabbed inspector: live composed preview, per-cell properties, and local-vs-global skill override diff.
          </DCPostIt>
        </DCArtboard>
      </DCSection>

      {/* ===== MONITOR ===== */}
      <DCSection id="monitor" title="Monitor"
        subtitle="Converged direction: V1 refined + clickable FSM pipeline strip + stage-config modal (change CLI / skill per stage)">
        <DCArtboard id="mon-clean" label="Monitor — run active, chat closed" width={W} height={H}>
          <MonitorMain chat={false} blocked={false} />
          <DCPostIt top={160} left={340} rotate={-2} width={210}>
            Global Run Bar (below header, every view): feature · stage dots · current phase · cost · ▶ ⏸ ⏹. Click any pipeline node → config modal.
          </DCPostIt>
        </DCArtboard>
        <DCArtboard id="mon-blocked" label="Monitor — blocked (gate fail) + chat open" width={W} height={H}>
          <MonitorMain chat blocked />
          <DCPostIt top={160} right={230} rotate={2} width={210}>
            When blocked: Advance / Reroute / Retry appear in the Run Bar. Chat stays as initiation surface — not transport controls.
          </DCPostIt>
        </DCArtboard>
        <DCArtboard id="mon-modal" label="Monitor — stage config modal (click BUILD)" width={W} height={H}>
          <StageConfigBoard />
          <DCPostIt top={120} left={300} rotate={-2} width={220}>
            Clicking any stage opens this modal: swap adapter (Claude / Codex / Copilot / Gemini), change skill .md, scope to this run or every run.
          </DCPostIt>
        </DCArtboard>
      </DCSection>

      {/* ===== CHAT + SETTINGS ===== */}
      <DCSection id="system" title="Chat dock + Settings"
        subtitle="HQ chat as initiation surface · Settings with 12-palette swatch picker · routing engine + runner config">
        <DCArtboard id="monitor-chat" label="Monitor + Chat dock open" width={W} height={H}>
          <MonitorMain chat blocked={false} />
        </DCArtboard>
        <DCArtboard id="settings" label="Settings screen" width={W} height={H}>
          <SettingsBoard />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
