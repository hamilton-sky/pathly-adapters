<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pathly Studio — Notebook & Monitor directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="studio.css" />
<link rel="stylesheet" href="redesign.css" />
<style>
  html, body { background: #f0eee9; }
  /* keep the dark Studio comps self-contained inside each artboard */
  .dc-card .app { border-radius: 0; }
</style>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1e1e2e"/>
    <rect x="30" y="30" width="40" height="40" rx="6" fill="none" stroke="#cba6f7" stroke-width="3"/>
    <rect x="38" y="40" width="24" height="4" rx="2" fill="#fab387"/>
    <rect x="38" y="49" width="24" height="4" rx="2" fill="#89b4fa"/>
    <rect x="38" y="58" width="14" height="4" rx="2" fill="#a6e3a1"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="notebook-directions.jsx"></script>
<script type="text/babel" src="monitor-directions.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
const W = 1180, H = 760;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="notebook" title="Notebook" subtitle="Pick one direction — evolves the existing cell engine, adds drag-free arrows · select-to-cell · import split">
        <DCArtboard id="nb-v1" label="V1 · Evolved Colab (two-pane)" width={W} height={H}>
          <NotebookV1 />
          <DCPostIt top={150} left={372} rotate={-3} width={200}>Hover toolbar + ⋮ menu (copy / duplicate / change type). Select text → "New cell from selection" bubble.</DCPostIt>
        </DCArtboard>
        <DCArtboard id="nb-v2" label="V2 · Document focus + import dialog" width={W} height={H}>
          <NotebookV2 />
          <DCPostIt top={120} left={250} rotate={-2} width={210}>Calm single column; preview slides in from the right. Import .md shows a split preview to confirm or deny.</DCPostIt>
        </DCArtboard>
        <DCArtboard id="nb-v3" label="V3 · Split inspector (Preview / Cell / Override)" width={W} height={H}>
          <NotebookV3 />
          <DCPostIt top={120} right={250} rotate={2} width={210}>Right rail becomes a tabbed inspector: live preview, per-cell properties, and local-vs-global override diff.</DCPostIt>
        </DCArtboard>
      </DCSection>

      <DCSection id="monitor" title="Monitor" subtitle="You asked for real rework — here are three takes on watching a live run">
        <DCArtboard id="mon-v1" label="V1 · Refined current (stepper + event table)" width={W} height={H}>
          <MonitorV1 />
        </DCArtboard>
        <DCArtboard id="mon-v2" label="V2 · Live timeline hero" width={W} height={H}>
          <MonitorV2 />
          <DCPostIt top={150} right={250} rotate={2} width={200}>Vertical channel-colored activity feed is the centerpiece; live pulse on the newest event.</DCPostIt>
        </DCArtboard>
        <DCArtboard id="mon-v3" label="V3 · Mission control (pipeline + live terminal)" width={W} height={H}>
          <MonitorV3 />
          <DCPostIt top={150} left={372} rotate={-2} width={200}>Pipeline stages on the left, the actual agent PTY streaming on the right — "see the flow happen".</DCPostIt>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
