<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pathly Studio — 12 Palettes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --page-bg: #0c0e14;
    --page-panel: #14171f;
    --page-line: #232733;
    --page-text: #e6e9ef;
    --page-muted: #7c8499;
    --font-base: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  }

  body {
    font-family: var(--font-base);
    background: var(--page-bg);
    color: var(--page-text);
    padding: 40px 32px 64px;
    min-height: 100vh;
  }

  .page-head {
    max-width: 1320px;
    margin: 0 auto 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .page-head h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .page-head p {
    font-size: 13px;
    color: var(--page-muted);
    margin-top: 6px;
    max-width: 560px;
    line-height: 1.5;
  }
  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--page-muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    width: 10px; height: 10px; border-radius: 3px; display: inline-block;
  }

  .group-label {
    max-width: 1320px;
    margin: 0 auto 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--page-muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .group-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--page-line);
  }

  .grid {
    max-width: 1320px;
    margin: 0 auto 40px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px)  { .grid { grid-template-columns: 1fr; } }

  /* ── CARD ── */
  .card {
    background: var(--page-panel);
    border: 1px solid var(--page-line);
    border-radius: 14px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--page-line);
  }
  .card-name { font-size: 13px; font-weight: 600; }
  .card-key { font-size: 11px; color: var(--page-muted); font-family: var(--font-mono); }

  /* ── THEMED PANEL ── (all colors via --c-* vars) */
  .panel {
    background: var(--c-base);
    color: var(--c-text);
    font-family: var(--font-base);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    background: var(--c-mantle);
    border-bottom: 1px solid var(--c-border);
  }
  .topbar-title { font-size: 12px; font-weight: 600; color: var(--c-text); }
  .topbar-tabs { display: flex; gap: 2px; }
  .tab {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    color: var(--c-muted);
    font-weight: 500;
  }
  .tab.active { background: color-mix(in srgb, var(--c-accent) 16%, transparent); color: var(--c-accent); }
  .publish-btn {
    font-size: 11px;
    font-weight: 600;
    background: var(--c-accent);
    color: var(--c-base);
    border: none;
    border-radius: 6px;
    padding: 4px 11px;
  }

  .plan-header { padding: 11px 14px 10px; border-bottom: 1px solid var(--c-border); }
  .plan-header-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .plan-header-name { font-size: 13px; font-weight: 700; color: var(--c-text); }
  .badge-reviewing {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    background: color-mix(in srgb, var(--c-yellow) 18%, transparent);
    color: var(--c-yellow);
    border: 1px solid color-mix(in srgb, var(--c-yellow) 35%, transparent);
    border-radius: 4px; padding: 2px 7px;
  }
  .progress-bar-wrap { height: 4px; background: var(--c-surface0); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--c-green); border-radius: 99px; width: 33%; }
  .progress-meta {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 10px; color: var(--c-muted); font-variant-numeric: tabular-nums;
  }

  .conv-list { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .conv-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px; border: 1px solid transparent; position: relative;
  }
  .conv-row.done { background: color-mix(in srgb, var(--c-green) 12%, transparent); }
  .conv-row.done::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; background: var(--c-green); border-radius: 0 3px 3px 0;
  }
  .conv-row.next { background: var(--c-surface0); }
  .conv-row.selected { background: color-mix(in srgb, var(--c-accent) 14%, transparent); }
  .conv-row.selected::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; background: var(--c-accent); border-radius: 0 3px 3px 0;
  }
  .conv-row.future { opacity: 0.5; }

  .conv-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-todo { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--c-muted); }
  .icon-selected { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--c-accent); background: color-mix(in srgb, var(--c-accent) 45%, transparent); }
  .icon-next { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--c-blue); position: relative; }
  .icon-next::after {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-40%, -50%);
    border-left: 5px solid var(--c-blue); border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }

  .conv-content { flex: 1; min-width: 0; }
  .conv-title { font-size: 12px; line-height: 1.3; }
  .conv-num { font-weight: 700; color: var(--c-text); }
  .conv-num.done-text { color: var(--c-green); }
  .conv-num.selected-text { color: var(--c-accent); }
  .conv-phase { font-weight: 400; color: var(--c-muted); font-size: 11px; margin-left: 3px; }
  .conv-stats { font-size: 10px; color: var(--c-muted); margin-top: 2px; font-family: var(--font-mono); }

  .status-badge {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 99px; flex-shrink: 0; text-transform: lowercase;
  }
  .badge-done { background: color-mix(in srgb, var(--c-green) 16%, transparent); color: var(--c-green); }
  .badge-next { background: color-mix(in srgb, var(--c-blue) 16%, transparent); color: var(--c-blue); }
  .badge-active { background: color-mix(in srgb, var(--c-accent) 16%, transparent); color: var(--c-accent); }
  .badge-todo { background: var(--c-surface0); color: var(--c-muted); }

  .list-divider { height: 1px; background: var(--c-border); margin: 3px 10px; }

  /* ── TERMINAL STRIP ── */
  .terminal {
    background: var(--c-terminal);
    border-top: 1px solid var(--c-border);
    padding: 10px 14px 12px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.7;
  }
  .terminal-head {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--c-muted); margin-bottom: 6px; font-family: var(--font-base); font-weight: 600;
  }
  .log .t { color: var(--c-muted); }
  .log .ok { color: var(--c-green); }
  .log .info { color: var(--c-blue); }
  .log .warn { color: var(--c-yellow); }
  .log .err { color: var(--c-red); }
  .log .rt { color: var(--c-runtime); }
  .log .txt { color: var(--c-secondary); }

  /* swatch strip */
  .swatches { display: flex; gap: 0; padding: 0; }
  .swatches i { flex: 1; height: 7px; }
</style>
</head>
<body>

<div class="page-head">
  <div>
    <h1>Pathly Studio · 12 Shipped Palettes</h1>
    <p>One representative slice of the UI — top bar, plan panel, and log terminal — re-skinned with every shipped theme's actual tokens. Six dark, six light.</p>
  </div>
  <div class="legend">
    <span><i style="background:#38BDF8"></i>accent</span>
    <span><i style="background:#60A5FA"></i>blue</span>
    <span><i style="background:#34D399"></i>green</span>
    <span><i style="background:#FCD34D"></i>yellow</span>
    <span><i style="background:#f87171"></i>red</span>
    <span><i style="background:#2DD4BF"></i>runtime</span>
  </div>
</div>

<div class="group-label">Dark</div>
<div class="grid" id="grid-dark"></div>

<div class="group-label">Light</div>
<div class="grid" id="grid-light"></div>

<script>
const themes = {
  dark: { label:'Pathly Dark', bgBase:'#111827', bgMantle:'#0B0F1A', bgSurface0:'#1E2433', bgTerminal:'#0d1117', textPrimary:'#E2E8F0', textSecondary:'#94A3B8', textMuted:'#64748B', accent:'#38BDF8', blue:'#60A5FA', green:'#34D399', red:'#f87171', yellow:'#FCD34D', runtime:'#2DD4BF', border:'#283044' },
  nord: { label:'Nord', bgBase:'#2e3440', bgMantle:'#242933', bgSurface0:'#3b4252', bgTerminal:'#1c2028', textPrimary:'#eceff4', textSecondary:'#d8dee9', textMuted:'#4c566a', accent:'#88c0d0', blue:'#81a1c1', green:'#a3be8c', red:'#bf616a', yellow:'#ebcb8b', runtime:'#8fbcbb', border:'#434c5e' },
  mocha: { label:'Mocha', bgBase:'#1e1e2e', bgMantle:'#181825', bgSurface0:'#313244', bgTerminal:'#11111b', textPrimary:'#cdd6f4', textSecondary:'#bac2de', textMuted:'#6c7086', accent:'#cba6f7', blue:'#89b4fa', green:'#a6e3a1', red:'#f38ba8', yellow:'#f9e2af', runtime:'#94e2d5', border:'#45475a' },
  solarized: { label:'Solarized', bgBase:'#002b36', bgMantle:'#00212b', bgSurface0:'#073642', bgTerminal:'#001e26', textPrimary:'#fdf6e3', textSecondary:'#eee8d5', textMuted:'#657b83', accent:'#268bd2', blue:'#2aa198', green:'#859900', red:'#dc322f', yellow:'#b58900', runtime:'#6c71c4', border:'#586e75' },
  dracula: { label:'Dracula', bgBase:'#282a36', bgMantle:'#191a21', bgSurface0:'#44475a', bgTerminal:'#1a1b23', textPrimary:'#f8f8f2', textSecondary:'#b0b2c8', textMuted:'#6272a4', accent:'#bd93f9', blue:'#8be9fd', green:'#50fa7b', red:'#ff5555', yellow:'#f1fa8c', runtime:'#ffb86c', border:'#44475a' },
  'rose-pine': { label:'Rosé Pine', bgBase:'#191724', bgMantle:'#12111a', bgSurface0:'#26233a', bgTerminal:'#0d0c14', textPrimary:'#e0def4', textSecondary:'#c4c0d9', textMuted:'#6e6a86', accent:'#c4a7e7', blue:'#9ccfd8', green:'#56a37a', red:'#eb6f92', yellow:'#f6c177', runtime:'#ebbcba', border:'#403d52' },
  light: { label:'Pathly Light', bgBase:'#F8FAFC', bgMantle:'#F0F9FF', bgSurface0:'#E2E8F0', bgTerminal:'#edf2f7', textPrimary:'#0F172A', textSecondary:'#334155', textMuted:'#64748B', accent:'#0369A1', blue:'#1D4ED8', green:'#047857', red:'#dc2626', yellow:'#B45309', runtime:'#0F766E', border:'#CBD5E1' },
  'solarized-light': { label:'Sol. Light', bgBase:'#fdf6e3', bgMantle:'#eee8d5', bgSurface0:'#e0d9c5', bgTerminal:'#f5efdc', textPrimary:'#002b36', textSecondary:'#3a6270', textMuted:'#93a1a1', accent:'#268bd2', blue:'#2aa198', green:'#859900', red:'#dc322f', yellow:'#b58900', runtime:'#6c71c4', border:'#cbc4b0' },
  latte: { label:'Latte', bgBase:'#eff1f5', bgMantle:'#e6e9ef', bgSurface0:'#ccd0da', bgTerminal:'#dce0e8', textPrimary:'#4c4f69', textSecondary:'#5c5f77', textMuted:'#8c8fa1', accent:'#8839ef', blue:'#1e66f5', green:'#40a02b', red:'#d20f39', yellow:'#df8e1d', runtime:'#179299', border:'#bcc0cc' },
  paper: { label:'Paper', bgBase:'#ffffff', bgMantle:'#f9f9f7', bgSurface0:'#f0ede8', bgTerminal:'#f5f2ec', textPrimary:'#1a1a1a', textSecondary:'#4a4a4a', textMuted:'#9a9a9a', accent:'#c75c2a', blue:'#2563eb', green:'#16a34a', red:'#dc2626', yellow:'#d97706', runtime:'#0891b2', border:'#e4e0da' },
  'rose-pine-dawn': { label:'Dawn', bgBase:'#faf4ed', bgMantle:'#f4ede6', bgSurface0:'#ebe3d9', bgTerminal:'#f0e8d8', textPrimary:'#575279', textSecondary:'#6b6496', textMuted:'#9893a5', accent:'#b4637a', blue:'#56949f', green:'#286983', red:'#c0334a', yellow:'#ea9d34', runtime:'#907aa9', border:'#e4dfda' },
  mint: { label:'Mint', bgBase:'#f0faf5', bgMantle:'#e8f5ef', bgSurface0:'#d4ede0', bgTerminal:'#e0f2e9', textPrimary:'#1a3028', textSecondary:'#2d5040', textMuted:'#7aaa8e', accent:'#0891b2', blue:'#1a6fa0', green:'#0f7d52', red:'#c0392b', yellow:'#c07a00', runtime:'#6366a8', border:'#bde0cc' },
};

const DARK = ['dark','nord','mocha','solarized','dracula','rose-pine'];
const LIGHT = ['light','solarized-light','latte','paper','rose-pine-dawn','mint'];

function panelHTML(key, t) {
  const vars = [
    ['--c-base', t.bgBase], ['--c-mantle', t.bgMantle], ['--c-surface0', t.bgSurface0],
    ['--c-terminal', t.bgTerminal], ['--c-text', t.textPrimary], ['--c-secondary', t.textSecondary],
    ['--c-muted', t.textMuted], ['--c-accent', t.accent], ['--c-blue', t.blue], ['--c-green', t.green],
    ['--c-red', t.red], ['--c-yellow', t.yellow], ['--c-runtime', t.runtime], ['--c-border', t.border],
  ].map(([k,v]) => `${k}:${v}`).join(';');

  return `
  <div class="card">
    <div class="card-head">
      <span class="card-name">${t.label}</span>
      <span class="card-key">${key}</span>
    </div>
    <div class="panel" style="${vars}">
      <div class="topbar">
        <span class="topbar-title">studio-ai-chat</span>
        <div class="topbar-tabs">
          <span class="tab">Canvas</span>
          <span class="tab active">Plan</span>
          <span class="tab">Monitor</span>
        </div>
        <button class="publish-btn">Publish</button>
      </div>

      <div class="plan-header">
        <div class="plan-header-row">
          <span class="plan-header-name">studio-ai-chat</span>
          <span class="badge-reviewing">Reviewing</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
        <div class="progress-meta"><span>3 of 9 conversations done</span><span>33%</span></div>
      </div>

      <div class="conv-list">
        <div class="conv-row done">
          <div class="conv-icon"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="${t.green}" stroke-width="1.4"/><path d="M4.5 7.8l2 2 4-4" stroke="${t.green}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="conv-content">
            <div class="conv-title"><span class="conv-num done-text">Conv 2</span><span class="conv-phase">· 4–8</span></div>
            <div class="conv-stats">24.3k in · 6.1k out · $0.164</div>
          </div>
          <span class="status-badge badge-done">done</span>
        </div>
        <div class="list-divider"></div>
        <div class="conv-row selected">
          <div class="conv-icon"><div class="icon-selected"></div></div>
          <div class="conv-content"><div class="conv-title"><span class="conv-num selected-text">Conv 3</span><span class="conv-phase">· 9–11</span></div></div>
          <span class="status-badge badge-active">active</span>
        </div>
        <div class="conv-row next">
          <div class="conv-icon"><div class="icon-next"></div></div>
          <div class="conv-content"><div class="conv-title"><span class="conv-num">Conv 4</span><span class="conv-phase">· 12–14</span></div></div>
          <span class="status-badge badge-next">next</span>
        </div>
        <div class="conv-row future">
          <div class="conv-icon"><div class="icon-todo"></div></div>
          <div class="conv-content"><div class="conv-title"><span class="conv-num">Conv 5</span><span class="conv-phase">· 15–18</span></div></div>
          <span class="status-badge badge-todo">todo</span>
        </div>
      </div>

      <div class="terminal">
        <div class="terminal-head">Monitor · live</div>
        <div class="log"><span class="t">14:22:01</span> <span class="ok">✓ adapter compose ok</span> <span class="txt">— 4 tools</span></div>
        <div class="log"><span class="t">14:22:03</span> <span class="info">→ runner</span> <span class="rt">dispatch fsm:running</span></div>
        <div class="log"><span class="t">14:22:04</span> <span class="warn">⚠ stale manifest</span> <span class="txt">— refetching</span></div>
        <div class="log"><span class="t">14:22:06</span> <span class="err">✗ gate failed</span> <span class="txt">— retry 1/3</span></div>
      </div>
    </div>
  </div>`;
}

document.getElementById('grid-dark').innerHTML = DARK.map(k => panelHTML(k, themes[k])).join('');
document.getElementById('grid-light').innerHTML = LIGHT.map(k => panelHTML(k, themes[k])).join('');
</script>

</body>
</html>
