<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pathly · Sidebar Directions</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"><\/script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"><\/script>
<script src="./assets/vendor/icons.js"><\/script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"><\/script>
<style>
  body { margin: 0; background: var(--bg-base); }
  .sb { width: 100%; height: 100%; background: var(--bg-mantle); display: flex; flex-direction: column;
    font-family: var(--font-family-base); color: var(--text-secondary); overflow: hidden; }
  .sb-head { display: flex; align-items: center; gap: 7px; padding: 11px 12px 8px; flex-shrink: 0; }
  .sb-head .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-primary); }
  .sb-head .ttl .pj { font-family: var(--font-family-mono); font-weight: 400; color: var(--text-muted); font-size: 11px; }
  .sb-head .accent { color: var(--accent); display: inline-flex; }
  .sb-head .live { color: var(--green); display: inline-flex; }
  .ico-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-md); color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
  .ico-btn:hover { background: var(--bg-surface0); color: var(--accent); }
  .sb-filter { padding: 0 10px 8px; flex-shrink: 0; }
  .sb-filter input { width: 100%; box-sizing: border-box; background: var(--bg-base); border: var(--border);
    border-radius: var(--radius-md); padding: 6px 9px; color: var(--text-primary); font-size: 12.5px;
    font-family: var(--font-family-base); outline: none; }
  .sb-filter input::placeholder { color: var(--text-muted); }
  .sb-filter input:focus { border-color: var(--accent); }
  .sb-body { flex: 1; min-height: 0; padding: 2px 0 6px; overflow: hidden; }
  .grp { display: flex; align-items: center; gap: 6px; padding: 7px 12px 2px; }
  .grp .gl { flex: 1; font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }
  .grp .gnew { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--accent); opacity: 0.7; cursor: pointer; }
  .grp .gnew:hover { opacity: 1; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 16px; font-size: 13px;
    color: var(--text-secondary); border-left: 2px solid transparent; cursor: pointer; }
  .row:hover { background: var(--bg-surface0); color: var(--text-primary); }
  .row.on { background: var(--bg-surface0); border-left-color: var(--accent); color: var(--text-primary); font-weight: 500; }
  .row.deep { padding-left: 30px; }
  .row.deeper { padding-left: 42px; }
  .row .ico { color: currentColor; opacity: 0.8; display: inline-flex; flex-shrink: 0; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .mono { font-family: var(--font-family-mono); font-size: 12.5px; }
  .row .tag { font-family: var(--font-family-mono); font-size: 10px; color: var(--text-muted); }
  .row .grip { color: var(--text-muted); opacity: 0.3; cursor: grab; display: inline-flex; margin-left: -4px; }
  .row:hover .grip { opacity: 0.75; }
  .row .add { margin-left: auto; width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .fold { display: flex; align-items: center; gap: 6px; padding: 5px 12px; color: var(--text-secondary);
    font-size: 12.5px; cursor: pointer; }
  .fold:hover { background: var(--bg-surface0); color: var(--text-primary); }
  .fold.deep { padding-left: 24px; }
  .fold .ico { display: inline-flex; opacity: 0.9; color: var(--accent); }
  .fold .nm { flex: 1; }
  .fold .chev { display: inline-flex; opacity: 0.6; }
  .fold .mono { font-family: var(--font-family-mono); }
  .trail { display: flex; align-items: center; gap: 4px; padding: 3px 12px 9px 38px; flex-wrap: wrap; }
  .trail .tp { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-family-mono); font-size: 10px;
    padding: 2px 7px; border-radius: 999px; border: var(--border); color: var(--text-muted); }
  .trail .tp.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .trail .tp.act { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .trail .arr { color: var(--text-muted); }
  .led { display: flex; align-items: center; gap: 7px; padding: 9px 12px 3px; }
  .led .ld { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .led .lname { font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-secondary); }
  .led .lby { font-family: var(--font-family-mono); font-size: 10px; color: var(--text-muted); margin-left: auto; }
  .nb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 10px 6px; }
  .tile { background: var(--bg-surface0); border: var(--border); border-radius: var(--radius-md);
    padding: 7px 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; position: relative;
    transition: border-color var(--transition-fast); }
  .tile:hover { border-color: var(--accent-border); }
  .tile .ti { color: var(--accent); display: inline-flex; }
  .tile .tn { font-family: var(--font-family-mono); font-size: 10.5px; color: var(--text-primary); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .tc { font-size: 8px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .tile .tadd { position: absolute; top: 5px; right: 5px; width: 16px; height: 16px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); opacity: 0; }
  .tile:hover .tadd { opacity: 1; }
  .evt { display: flex; gap: 8px; align-items: baseline; padding: 3px 12px; font-family: var(--font-family-mono);
    font-size: 11px; line-height: 1.5; }
  .evt .t { color: var(--text-muted); flex-shrink: 0; opacity: 0.85; }
  .evt .g { flex-shrink: 0; display: inline-flex; }
  .evt .x { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evt .ok { color: var(--green); } .evt .info { color: var(--accent); } .evt .warn { color: var(--orange); }
  .evt .err { color: var(--red); } .evt .blue { color: var(--blue); }
  .ag { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-left: 2px solid transparent; }
  .ag.on { border-left-color: var(--accent); background: var(--bg-surface0); }
  .ag .sd { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .ag .sd.run { background: var(--accent); }
  .ag .sd.queue { background: var(--blue); }
  .ag .sd.done { background: var(--green); }
  .ag .sd.idle { background: var(--text-muted); }
  .ag .ainfo { flex: 1; min-width: 0; }
  .ag .an { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .ag .aa { font-size: 10px; color: var(--text-muted); font-family: var(--font-family-mono); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag .atok { font-family: var(--font-family-mono); font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .ag .sd.run { animation: dotpulse 1.5s ease-in-out infinite; }
    @keyframes dotpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
      50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 0%, transparent); } }
  }
  .mstrip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 11px 14px; border-top: var(--border); flex-shrink: 0; }
  .mstrip .k { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
  .mstrip .v { font-family: var(--font-family-mono); font-size: 14px; color: var(--text-primary); margin-top: 2px; }
  .mstrip .v.g { color: var(--green); }
  .hint { font-size: 10px; color: var(--text-muted); padding: 7px 12px 4px 16px; font-style: italic; }
  .divider { height: 1px; background: var(--bg-surface0); margin: 5px 10px; }
  .profile { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-top: var(--border); flex-shrink: 0; }
  .avatar { width: 26px; height: 26px; border-radius: var(--radius-md); background: var(--brand-gradient); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .who .n { font-size: 12px; color: var(--text-primary); font-weight: 500; }
  .who .m { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./design-canvas.jsx"><\/script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
function Ico({ n, s = 14 }) {
  const html = window.PathlyIcons && PathlyIcons.svg ? PathlyIcons.svg(n, { size: s }) : '';
  return <span className="ico" dangerouslySetInnerHTML={{ __html: html }} />;
}
const Grip = () => <span className="grip"><Ico n="grip-vertical" s={13} /></span>;
function Head({ icon, title, project, live, btn = 'refresh-cw', anchor }) {
  const extra = anchor ? { 'data-comment-anchor': anchor } : {};
  return (
    <div className="sb-head" {...extra}>
      <span className="ttl">
        <span className="accent"><Ico n={icon} s={14} /></span>
        {title}
        {project && <span className="pj">· {project}</span>}
        {live && <span className="live"><Ico n="circle-dot" s={11} /></span>}
      </span>
      {btn && <span className="ico-btn"><Ico n={btn} s={14} /></span>}
    </div>
  );
}
const Grp = ({ label, onNew }) => (
  <div className="grp"><span className="gl">{label}</span>{onNew && <span className="gnew"><Ico n="plus" s={11} />New</span>}</div>
);
function ResRow({ icon, name, tag, add, drag, deep, on }) {
  return (
    <div className={'row' + (deep ? ' deep' : '') + (on ? ' on' : '')}>
      {drag && <Grip />}
      <span className="ico"><Ico n={icon} s={13} /></span>
      <span className="nm mono">{name}</span>
      {tag && <span className="tag">{tag}</span>}
      {add && <span className="add"><Ico n="plus" s={12} /></span>}
    </div>
  );
}
function Profile() {
  return (
    <div className="profile">
      <div className="avatar">BS</div>
      <div className="who"><span className="n">brightsky</span><span className="m">sky@pathly.dev</span></div>
    </div>
  );
}
function FilesTree() {
  return (
    <div className="sb">
      <Head icon="folder-open" title="Files" project="studio-ai-chat" btn="refresh-cw" anchor="87209a53c4-div-23-69" />
      <div className="sb-filter"><input placeholder="Find an artifact…" /></div>
      <div className="sb-body">
        <div className="fold"><span className="chev"><Ico n="chevron-down" s={12} /></span><span className="ico"><Ico n="folder-open" s={13} /></span><span className="nm">pathly</span></div>
        <div className="fold deep"><span className="chev"><Ico n="chevron-down" s={12} /></span><span className="ico"><Ico n="folder-open" s={13} /></span><span className="nm mono">plans/fsm-sqlite</span></div>
        <div className="row deeper"><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">STATE.json</span></div>
        <div className="row deeper"><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">01-plan.md</span></div>
        <div className="fold"><span className="chev"><Ico n="chevron-down" s={12} /></span><span className="ico"><Ico n="folder-open" s={13} /></span><span className="nm">src</span></div>
        <div className="row deep on"><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">auth.ts</span><span className="tag">↩ 1</span></div>
        <div className="trail">
          <span className="tp done"><Ico n="check" s={10} />planner</span><span className="arr">›</span>
          <span className="tp done"><Ico n="check" s={10} />builder</span><span className="arr">›</span>
          <span className="tp act">reviewer</span><span className="arr">›</span>
          <span className="tp">tester</span>
        </div>
        <div className="row deep"><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">auth.test.ts</span></div>
        <div className="row deep"><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">db.ts</span></div>
      </div>
      <Profile />
    </div>
  );
}
function FilesLedger() {
  const groups = [
    ['PLANNING', 'planner', 'var(--state-planning)', [['plan.md', '→ builder'], ['STATE.json', '']]],
    ['BUILDING', 'builder', 'var(--state-building)', [['auth.ts', '→ reviewer'], ['auth.test.ts', ''], ['db.ts', '']]],
    ['REVIEWING', 'reviewer', 'var(--state-reviewing)', [['review.md', '→ tester']]],
  ];
  return (
    <div className="sb">
      <Head icon="git-branch" title="Artifacts" project="by agent" btn="refresh-cw" />
      <div className="sb-filter"><input placeholder="Find an artifact…" /></div>
      <div className="sb-body">
        {groups.map(([st, who, col, files]) => (
          <div key={st}>
            <div className="led"><span className="ld" style={{ background: col }}></span><span className="lname">{st}</span><span className="lby">{who}</span></div>
            {files.map(([f, h]) => (
              <div className="row deep" key={f}><span className="ico"><Ico n="file-text" s={13} /></span><span className="nm mono">{f}</span>{h && <span className="tag">{h}</span>}</div>
            ))}
          </div>
        ))}
      </div>
      <Profile />
    </div>
  );
}
function CanvasResources() {
  return (
    <div className="sb">
      <Head icon="git-branch" title="Library" btn="search" />
      <div className="sb-filter"><input placeholder="Filter resources…" /></div>
      <div className="sb-body">
        <Grp label="Flows" onNew />
        <ResRow drag icon="git-branch" name="quick-fix.yaml" tag="3 states" />
        <ResRow drag icon="git-branch" name="ship-fast.yaml" tag="5 states" />
        <Grp label="Agents" onNew />
        {['planner', 'builder', 'reviewer', 'tester'].map(a => <ResRow key={a} drag icon="brain" name={a} />)}
        <Grp label="Skills" onNew />
        {['build.md', 'fixing.md', 'review.md', 'plan.md'].map(s => <ResRow key={s} drag icon="diamond" name={s} />)}
        <Grp label="Templates" onNew />
        {['fsm-base', 'retro-loop'].map(t => <ResRow key={t} drag icon="layout-grid" name={t} />)}
        <div className="hint">Drag any item onto the canvas · ＋ to create new</div>
      </div>
      <Profile />
    </div>
  );
}
function NotebookResources() {
  return (
    <div className="sb">
      <Head icon="sparkles" title="Notebook" project="build.md" btn="search" />
      <div className="sb-filter"><input placeholder="Filter resources…" /></div>
      <div className="sb-body">
        <Grp label="Agents" onNew />
        {['planner', 'builder', 'reviewer'].map(a => <ResRow key={a} drag add icon="brain" name={a} />)}
        <Grp label="Skills" onNew />
        {['build.md', 'fixing.md', 'review.md'].map(s => <ResRow key={s} drag add icon="diamond" name={s} />)}
        <Grp label="Templates" onNew />
        {['fsm-base', 'retro-loop'].map(t => <ResRow key={t} drag add icon="layout-grid" name={t} />)}
        <div className="hint">Click ＋ or drag to add a cell · no flows here</div>
      </div>
      <Profile />
    </div>
  );
}
function NotebookGridCompact() {
  const icon = { agent: 'brain', skill: 'diamond', tmpl: 'layout-grid' };
  const groups = [
    ['AGENTS', [['planner', 'agent'], ['builder', 'agent'], ['reviewer', 'agent']]],
    ['SKILLS', [['build.md', 'skill'], ['fixing.md', 'skill'], ['review.md', 'skill'], ['plan.md', 'skill']]],
    ['TEMPLATES', [['fsm-base', 'tmpl'], ['retro', 'tmpl']]],
  ];
  return (
    <div className="sb">
      <Head icon="sparkles" title="Notebook" project="build.md" btn="search" />
      <div className="sb-filter"><input placeholder="Filter…" /></div>
      <div className="sb-body">
        {groups.map(([lbl, items]) => (
          <div key={lbl}>
            <div className="grp"><span className="gl">{lbl}</span></div>
            <div className="nb-grid">
              {items.map(([n, t]) => (
                <div className="tile" key={n}>
                  <span className="ti"><Ico n={icon[t]} s={13} /></span>
                  <span className="tn">{n}</span>
                  <span className="tc">{t}</span>
                  <span className="tadd"><Ico n="plus" s={12} /></span>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div className="hint">Smaller tiles · click to add a cell</div>
      </div>
      <Profile />
    </div>
  );
}
function MonitorEvents() {
  const evs = [
    ['09:02:11', 'ok', 'circle-check', 'gate pass — lint·type·test'],
    ['09:02:09', 'info', 'git-branch', 'BUILDING → REVIEWING'],
    ['09:01:52', 'blue', 'play', 'reviewer started'],
    ['09:01:40', 'warn', 'refresh-cw', 'reroute REVIEWING → BUILDING'],
    ['09:01:12', 'err', 'x', 'gate fail — 2 type errors'],
    ['09:00:48', 'ok', 'check', 'builder committed auth.ts'],
    ['09:00:20', 'info', 'git-branch', 'PLANNING → BUILDING'],
    ['08:59:55', 'blue', 'play', 'builder started'],
  ];
  return (
    <div className="sb">
      <Head icon="activity" title="Monitor" project="live" live btn="refresh-cw" />
      <div className="grp"><span className="gl">Event stream · fsm-sqlite</span></div>
      <div className="sb-body">
        {evs.map((e, i) => (
          <div className="evt" key={i}><span className="t">{e[0]}</span><span className={'g ' + e[1]}><Ico n={e[2]} s={12} /></span><span className="x">{e[3]}</span></div>
        ))}
      </div>
      <div className="mstrip">
        <div><div className="k">Events</div><div className="v">35</div></div>
        <div><div className="k">Cost</div><div className="v g">$3.64</div></div>
      </div>
    </div>
  );
}
function MonitorAgents() {
  const ags = [
    ['builder', 'run', 'writing auth.ts', '41.8k', true],
    ['reviewer', 'queue', 'queued', '—', false],
    ['planner', 'done', 'done · plan.md', '12.1k', false],
    ['tester', 'idle', 'idle', '—', false],
    ['retro', 'idle', 'idle', '—', false],
  ];
  return (
    <div className="sb">
      <Head icon="brain" title="Agents" project="live" live btn="refresh-cw" />
      <div className="grp"><span className="gl">Roster · fsm-sqlite · conv 1</span></div>
      <div className="sb-body">
        {ags.map((a, i) => (
          <div className={'ag' + (a[4] ? ' on' : '')} key={i}>
            <span className={'sd ' + a[1]}></span>
            <div className="ainfo"><div className="an">{a[0]}</div><div className="aa">{a[2]}</div></div>
            <span className="atok">{a[3]}</span>
          </div>
        ))}
      </div>
      <div className="mstrip">
        <div><div className="k">Tokens</div><div className="v">290,749</div></div>
        <div><div className="k">Elapsed</div><div className="v">6m 29s</div></div>
      </div>
    </div>
  );
}
function App() {
  return (
    <DesignCanvas>
      <DCSection id="files" title="Files" subtitle="① Project artifacts & each file's trail between agents · no tabs">
        <DCArtboard id="fi-a" label="A · File tree + agent trail" width={248} height={500}><FilesTree /></DCArtboard>
        <DCArtboard id="fi-b" label="B · Artifacts grouped by the agent that made them" width={248} height={440}><FilesLedger /></DCArtboard>
      </DCSection>
      <DCSection id="canvas" title="Canvas" subtitle="② All flows · agents · skills · templates — ＋ create, drag to canvas">
        <DCArtboard id="cv" label="Resource library — one list, drag onto the canvas" width={248} height={620}><CanvasResources /></DCArtboard>
      </DCSection>
      <DCSection id="notebook" title="Skill Notebook" subtitle="③ Agents · skills · templates (no flows) — add as a cell">
        <DCArtboard id="nb-a" label="A · Resource list — drag or ＋ to add" width={248} height={460}><NotebookResources /></DCArtboard>
        <DCArtboard id="nb-b" label="B · Compact grid — smaller tiles" width={248} height={460}><NotebookGridCompact /></DCArtboard>
      </DCSection>
      <DCSection id="monitor" title="Monitor — new ideas" subtitle="Dropped the list & stepper · live event stream vs. agent roster">
        <DCArtboard id="mo-a" label="A · Live event stream" width={248} height={470}><MonitorEvents /></DCArtboard>
        <DCArtboard id="mo-b" label="B · Agent roster — who's working now" width={248} height={430}><MonitorAgents /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
<\/script>
</body>
</html>
