<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; display:flex; align-items:center; gap:40px; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .lockup img { display:block; }
  .word { font-size:30px; font-weight:600; letter-spacing:-0.02em; }
  .sizes { display:flex; align-items:flex-end; gap:20px; }
  .sizes img { display:block; }
  .cap { font-family:var(--font-family-mono); font-size:10px; color:var(--text-muted); margin-top:8px; text-align:center; }
  .col { display:flex; flex-direction:column; align-items:center; }
</style></head>
<body>
  <div class="lockup">
    <img src="../assets/logo-mark.svg" width="56" height="56" alt="Pathly">
    <span class="word">Pathly</span>
  </div>
  <div class="sizes">
    <div class="col"><img src="../assets/logo-mark.svg" width="48" height="48"><div class="cap">48</div></div>
    <div class="col"><img src="../assets/logo-mark.svg" width="32" height="32"><div class="cap">32</div></div>
    <div class="col"><img src="../assets/logo-mark.svg" width="20" height="20"><div class="cap">20</div></div>
  </div>
</body></html>
