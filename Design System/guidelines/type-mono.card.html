<!-- @dsCard group="Type" viewport="700x170" name="Mono & metrics" subtitle="Geist Mono — numbers, IDs, costs, code" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px 24px; }
  .cell .k { font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); }
  .cell .v { font-family:var(--font-family-mono); font-size:18px; font-weight:500; margin-top:4px; }
  .cost { color:var(--green); }
  .id { color:var(--text-secondary); font-size:13px; }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="k">Tokens</div><div class="v">290,749</div></div>
    <div class="cell"><div class="k">Cost</div><div class="v cost">$3.64</div></div>
    <div class="cell"><div class="k">Duration</div><div class="v">6m 29s</div></div>
    <div class="cell"><div class="k">Session</div><div class="v id">fsm-sqlite</div></div>
    <div class="cell"><div class="k">Timestamp</div><div class="v id">09:02:11</div></div>
    <div class="cell"><div class="k">Convs</div><div class="v">3 / 3</div></div>
  </div>
</body></html>
