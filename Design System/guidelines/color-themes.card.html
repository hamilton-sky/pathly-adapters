<!-- @dsCard group="Colors" viewport="700x420" name="Theme palettes" subtitle="12 shipped palettes via [data-theme] — Pathly Dark is default" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:#06080f; font-family:var(--font-family-base); padding:22px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .tile { border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border-color);
    background:var(--bg-base); }
  .bar { height:22px; background:var(--bg-mantle); display:flex; align-items:center; gap:5px; padding:0 9px; }
  .mark { width:10px; height:10px; border-radius:3px; background:var(--brand-gradient,var(--accent)); }
  .barname { font-size:10px; font-weight:600; color:var(--text-secondary); }
  .body { padding:10px; }
  .card { background:var(--bg-surface0); border:1px solid var(--border-color);
    border-radius:var(--radius-sm); padding:8px; }
  .accent { height:8px; width:60%; background:var(--accent); border-radius:99px; }
  .dots { display:flex; gap:4px; margin-top:8px; }
  .dots span { width:9px; height:9px; border-radius:50%; }
  .name { font-size:10px; color:var(--text-muted); margin-top:7px; font-family:var(--font-family-mono); }
</style></head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const themes = [
      ['','Pathly Dark'],['light','Pathly Light'],['nord','Nord'],['mocha','Mocha'],
      ['solarized','Solarized'],['dracula','Dracula'],['rose-pine','Rosé Pine'],['solarized-light','Sol. Light'],
      ['latte','Latte'],['paper','Paper'],['rose-pine-dawn','Dawn'],['mint','Mint']
    ];
    document.getElementById('grid').innerHTML = themes.map(([t,n]) => `
      <div class="tile" ${t?`data-theme="${t}"`:''}>
        <div class="bar"><span class="mark"></span><span class="barname">Pathly</span></div>
        <div class="body">
          <div class="card">
            <div class="accent"></div>
            <div class="dots">
              <span style="background:var(--green)"></span>
              <span style="background:var(--orange)"></span>
              <span style="background:var(--purple)"></span>
              <span style="background:var(--red)"></span>
              <span style="background:var(--runtime)"></span>
            </div>
          </div>
          <div class="name">${n}</div>
        </div>
      </div>`).join('');
  </script>
</body></html>
