<!-- @dsCard group="Colors" viewport="700x160" name="Pipeline states" subtitle="FSM stage colours — the core domain language" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .pills { display:flex; flex-wrap:wrap; gap:10px; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px;
    border-radius:var(--radius-full); font-size:11px; font-weight:600; letter-spacing:0.04em;
    border:1px solid; background:var(--bg-surface0); }
  .dot { width:8px; height:8px; border-radius:50%; }
  .planning { color:var(--state-planning); border-color:color-mix(in srgb,var(--state-planning) 40%,transparent); }
  .building { color:var(--state-building); border-color:color-mix(in srgb,var(--state-building) 40%,transparent); }
  .reviewing { color:var(--state-reviewing); border-color:color-mix(in srgb,var(--state-reviewing) 40%,transparent); }
  .testing { color:var(--state-testing); border-color:color-mix(in srgb,var(--state-testing) 40%,transparent); }
  .retro { color:var(--state-retro); border-color:color-mix(in srgb,var(--state-retro) 40%,transparent); }
  .done { color:var(--state-done); border-color:color-mix(in srgb,var(--state-done) 40%,transparent); }
</style></head>
<body>
  <div class="pills">
    <span class="pill planning"><span class="dot" style="background:var(--state-planning)"></span>PLANNING</span>
    <span class="pill building"><span class="dot" style="background:var(--state-building)"></span>BUILDING</span>
    <span class="pill reviewing"><span class="dot" style="background:var(--state-reviewing)"></span>REVIEWING</span>
    <span class="pill testing"><span class="dot" style="background:var(--state-testing)"></span>TESTING</span>
    <span class="pill retro"><span class="dot" style="background:var(--state-retro)"></span>RETRO</span>
    <span class="pill done"><span class="dot" style="background:var(--state-done)"></span>DONE</span>
  </div>
</body></html>
