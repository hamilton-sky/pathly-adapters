<!-- @dsCard group="Brand" viewport="700x150" name="Brand gradient" subtitle="Blue → indigo → violet · mark fills & accent flourishes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .grad { height:60px; border-radius:var(--radius-lg); background:var(--brand-gradient); }
  .stops { display:flex; justify-content:space-between; margin-top:10px;
    font-family:var(--font-family-mono); font-size:11px; color:var(--text-secondary); }
  .note { font-size:11px; color:var(--text-muted); margin-top:6px; }
</style></head>
<body>
  <div class="grad"></div>
  <div class="stops"><span>#60A5FA</span><span>#818CF8</span><span>#A78BFA</span></div>
  <div class="note">Used only for the logo mark and rare hero flourishes — never as a UI surface or button fill.</div>
</body></html>
