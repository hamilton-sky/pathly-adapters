<!-- @dsCard group="Colors" viewport="700x170" name="Signal palette" subtitle="Functional hues · blue, green, red, yellow, teal, orange, purple" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .ramp { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .sw { height:54px; border-radius:var(--radius-md); }
  .lbl { margin-top:7px; font-size:11px; font-weight:600; }
  .var { font-family:var(--font-family-mono); font-size:9px; color:var(--text-muted); margin-top:1px; }
</style></head>
<body>
  <div class="ramp">
    <div><div class="sw" style="background:var(--blue)"></div><div class="lbl">Blue</div><div class="var">--blue</div></div>
    <div><div class="sw" style="background:var(--green)"></div><div class="lbl">Green</div><div class="var">--green</div></div>
    <div><div class="sw" style="background:var(--red)"></div><div class="lbl">Red</div><div class="var">--red</div></div>
    <div><div class="sw" style="background:var(--yellow)"></div><div class="lbl">Yellow</div><div class="var">--yellow</div></div>
    <div><div class="sw" style="background:var(--runtime)"></div><div class="lbl">Teal</div><div class="var">--runtime</div></div>
    <div><div class="sw" style="background:var(--orange)"></div><div class="lbl">Orange</div><div class="var">--orange</div></div>
    <div><div class="sw" style="background:var(--purple)"></div><div class="lbl">Purple</div><div class="var">--purple</div></div>
  </div>
</body></html>
