<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Dark-first elevation ramp · mantle → raised" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .ramp { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .sw { border-radius:var(--radius-md); border:1px solid var(--border-color); height:64px; }
  .lbl { margin-top:8px; font-size:11px; font-weight:600; }
  .var { font-family:var(--font-family-mono); font-size:10px; color:var(--text-muted); margin-top:2px; }
  .hex { font-family:var(--font-family-mono); font-size:10px; color:var(--text-secondary); }
  .s0 { background:var(--bg-mantle); }
  .s1 { background:var(--bg-base); }
  .s2 { background:var(--bg-surface0); }
  .s3 { background:var(--bg-surface1); }
  .s4 { background:var(--bg-terminal); }
</style></head>
<body>
  <div class="ramp">
    <div><div class="sw s0"></div><div class="lbl">Chrome</div><div class="var">--bg-mantle</div><div class="hex">#0B0F1A</div></div>
    <div><div class="sw s1"></div><div class="lbl">App</div><div class="var">--bg-base</div><div class="hex">#111827</div></div>
    <div><div class="sw s2"></div><div class="lbl">Card</div><div class="var">--bg-surface0</div><div class="hex">#1E2433</div></div>
    <div><div class="sw s3"></div><div class="lbl">Raised</div><div class="var">--bg-surface1</div><div class="hex">#283044</div></div>
    <div><div class="sw s4"></div><div class="lbl">Terminal</div><div class="var">--bg-terminal</div><div class="hex">#0d1117</div></div>
  </div>
</body></html>
