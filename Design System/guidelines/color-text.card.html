<!-- @dsCard group="Colors" viewport="700x150" name="Text & borders" subtitle="Foreground hierarchy on app canvas" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); padding:24px 28px;
    font-family:var(--font-family-base); }
  .stack { display:flex; flex-direction:column; gap:7px; }
  .stack div { font-size:15px; }
  .p { color:var(--text-primary); font-weight:500; }
  .s { color:var(--text-secondary); }
  .m { color:var(--text-muted); }
  .d { color:var(--text-disabled); }
  .var { font-family:var(--font-family-mono); font-size:10px; opacity:0.7; margin-left:8px; }
</style></head>
<body>
  <div class="stack">
    <div class="p">Primary — titles &amp; key content<span class="var">--text-primary · #E2E8F0</span></div>
    <div class="s">Secondary — supporting copy &amp; metadata<span class="var">--text-secondary · #A8BBCC</span></div>
    <div class="m">Muted — labels, captions, timestamps<span class="var">--text-muted · #8899B0</span></div>
    <div class="d">Disabled — inactive controls<span class="var">--text-disabled · #4A5568</span></div>
  </div>
</body></html>
