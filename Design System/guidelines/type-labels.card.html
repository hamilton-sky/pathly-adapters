<!-- @dsCard group="Type" viewport="700x150" name="Labels & weights" subtitle="Uppercase section label · 400/500/600/700" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; display:flex; flex-direction:column; gap:16px; }
  .label { font-size:var(--type-label-size); font-weight:var(--type-label-weight);
    letter-spacing:var(--type-label-spacing); text-transform:uppercase; color:var(--text-muted); }
  .weights { display:flex; gap:28px; align-items:baseline; }
  .weights span { font-size:18px; }
  .w4 { font-weight:400; } .w5 { font-weight:500; } .w6 { font-weight:600; } .w7 { font-weight:700; }
  .tag { font-family:var(--font-family-mono); font-size:10px; color:var(--text-muted); display:block; margin-top:2px; }
</style></head>
<body>
  <div class="label">State Machine · 9 Transitions</div>
  <div class="weights">
    <span class="w4">Regular<span class="tag">400</span></span>
    <span class="w5">Medium<span class="tag">500</span></span>
    <span class="w6">Semibold<span class="tag">600</span></span>
    <span class="w7">Bold<span class="tag">700</span></span>
  </div>
</body></html>
