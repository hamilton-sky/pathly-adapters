<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base · tight by design" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--accent); border-radius:2px; width:var(--w); height:var(--w); opacity:0.85; }
  .v { font-family:var(--font-family-mono); font-size:10px; color:var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="--w:4px"></div><span class="v">2</span></div>
    <div class="col"><div class="bar" style="--w:6px"></div><span class="v">4</span></div>
    <div class="col"><div class="bar" style="--w:8px"></div><span class="v">6</span></div>
    <div class="col"><div class="bar" style="--w:12px"></div><span class="v">8</span></div>
    <div class="col"><div class="bar" style="--w:16px"></div><span class="v">12</span></div>
    <div class="col"><div class="bar" style="--w:20px"></div><span class="v">16</span></div>
    <div class="col"><div class="bar" style="--w:24px"></div><span class="v">20</span></div>
    <div class="col"><div class="bar" style="--w:32px"></div><span class="v">24</span></div>
    <div class="col"><div class="bar" style="--w:48px"></div><span class="v">32</span></div>
    <div class="col"><div class="bar" style="--w:60px"></div><span class="v">48</span></div>
  </div>
</body></html>
