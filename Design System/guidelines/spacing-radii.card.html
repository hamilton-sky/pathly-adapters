<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Small & functional · 5px is the workhorse" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .row { display:flex; gap:20px; align-items:flex-start; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:64px; height:48px; background:var(--bg-surface0);
    border:1px solid var(--accent-border); }
  .lbl { font-size:11px; font-weight:600; }
  .v { font-family:var(--font-family-mono); font-size:10px; color:var(--text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs</span><span class="v">3px</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm</span><span class="v">4px</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md</span><span class="v">5px</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg</span><span class="v">8px</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl</span><span class="v">12px</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-full);width:48px"></div><span class="lbl">full</span><span class="v">pill</span></div>
  </div>
</body></html>
