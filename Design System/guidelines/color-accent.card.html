<!-- @dsCard group="Colors" viewport="700x180" name="Accent — bright sky" subtitle="The Pathly accent · interactive, focus, primary fill" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .wrap { display:flex; gap:20px; align-items:stretch; }
  .hero { width:200px; border-radius:var(--radius-lg); background:var(--accent);
    display:flex; flex-direction:column; justify-content:flex-end; padding:14px; color:#06243a; }
  .hero .n { font-weight:600; font-size:14px; }
  .hero .h { font-family:var(--font-family-mono); font-size:12px; opacity:0.8; }
  .tints { display:flex; flex-direction:column; gap:8px; flex:1; justify-content:center; }
  .tint { display:flex; align-items:center; gap:12px; }
  .chip { width:40px; height:28px; border-radius:var(--radius-sm); flex-shrink:0; }
  .t1 { background:var(--accent-bg); border:1px solid var(--accent-border); }
  .t2 { background:var(--accent-border); }
  .t3 { background:var(--accent-bg-hover); }
  .meta { font-family:var(--font-family-mono); font-size:11px; color:var(--text-secondary); }
</style></head>
<body>
  <div class="wrap">
    <div class="hero"><div class="n">--accent</div><div class="h">#38BDF8</div></div>
    <div class="tints">
      <div class="tint"><span class="chip t1"></span><span class="meta">--accent-bg · 13% tint (button fill, active nav)</span></div>
      <div class="tint"><span class="chip t2"></span><span class="meta">--accent-border · 40% (outlines, rings)</span></div>
      <div class="tint"><span class="chip t3"></span><span class="meta">--accent-bg-hover · 80% (hover state)</span></div>
    </div>
  </div>
</body></html>
