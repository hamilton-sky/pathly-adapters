<!-- @dsCard group="Type" viewport="700x180" name="Type scale" subtitle="Geist · 10 → 16px UI ramp, 13px base" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg-base); color:var(--text-primary);
    font-family:var(--font-family-base); padding:24px 28px; }
  .row { display:flex; align-items:baseline; gap:16px; padding:5px 0; }
  .px { font-family:var(--font-family-mono); font-size:11px; color:var(--text-muted); width:78px; flex-shrink:0; }
  .lg { font-size:var(--font-size-lg); }
  .md { font-size:var(--font-size-md); }
  .base { font-size:var(--font-size-base); }
  .sm { font-size:var(--font-size-sm); }
  .xs { font-size:var(--font-size-xs); }
</style></head>
<body>
  <div class="row"><span class="px">16 / lg</span><span class="lg">Panel title — Pathly Studio</span></div>
  <div class="row"><span class="px">14 / md</span><span class="md">Card title, emphasised body</span></div>
  <div class="row"><span class="px">13 / base</span><span class="base">Default UI &amp; body text used app-wide</span></div>
  <div class="row"><span class="px">11 / sm</span><span class="sm">Buttons, metadata, section labels</span></div>
  <div class="row"><span class="px">10 / xs</span><span class="xs">Micro labels &amp; badge counts</span></div>
</body></html>
