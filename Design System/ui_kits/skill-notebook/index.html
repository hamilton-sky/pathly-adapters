<!-- @dsCard group="Skill Notebook" viewport="1280x760" name="Skill Notebook" subtitle="Cell-based skill editor with live composed preview" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Pathly Studio — Skill Notebook</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../_shell/shell.css">
<link rel="stylesheet" href="notebook.css">
</head>
<body>
  <div class="app">
    <div id="pathly-topbar"></div>
    <div class="app-body">
      <div id="pathly-sidebar"></div>
      <main class="app-main nb-main">
        <div class="nb-bar">
          <div class="nb-crumbs" id="nb-crumbs"></div>
          <span class="nb-nbbadge">NOTEBOOK</span>
          <div class="nb-bar-actions">
            <button class="nb-iconbtn" title="Undo" id="nb-undo"></button>
            <button class="nb-iconbtn" title="Redo" id="nb-redo"></button>
            <button class="btn-b" id="nb-validate">Validate</button>
            <button class="btn-cta" id="nb-export">Export Skill</button>
          </div>
          <div class="nb-feature"><input placeholder="Feature path…" /></div>
        </div>
        <div class="nb-split">
          <div class="nb-editor">
            <div class="nb-search"><span class="si"></span><input placeholder="Search the skill text…" /></div>
            <div class="nb-cells" id="nb-cells"></div>
          </div>
          <aside class="nb-preview">
            <div class="nb-preview-head" id="nb-preview-head"></div>
            <div class="nb-preview-body" id="nb-preview-body"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script>window.PATHLY_SHELL = { project:'fsm-server-sqlite', activeNav:'notebook', sidebarTab:'library' };</script>
  <script src="../../assets/vendor/icons.js"></script>
  <script src="../_shell/shell.js"></script>
  <script src="notebook.js"></script>
</body></html>
