<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Pathly Studio — DB Explorer</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../_shell/shell.css">
<link rel="stylesheet" href="db-explorer.css">
</head>
<body>
  <div class="app">
    <div id="pathly-topbar"></div>
    <div class="app-body">
      <div id="pathly-sidebar"></div>
      <main class="app-main">
        <div class="page-head" style="display:flex; align-items:flex-start; justify-content:space-between; gap:20px;">
          <div>
            <h1 class="page-title">DB Explorer</h1>
            <p class="page-sub">Pipeline databases · <code>pathly/plans/*/pathly.db</code> · FSM server <code>127.0.0.1:8765</code></p>
          </div>
          <div class="head-actions" id="head-actions"></div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="db-filter-bar" id="db-filter-bar"></div>
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script>window.PATHLY_SHELL = { project:'fsm-server-sqlite', activeNav:null, activeSide:'db' };</script>
  <script src="../../assets/vendor/icons.js"></script>
  <script src="../_shell/shell.js"></script>
  <script src="db-explorer.js"></script>
</body></html>
