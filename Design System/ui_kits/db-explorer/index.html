<!-- @dsCard group="DB Explorer" viewport="1280x760" name="DB Explorer" subtitle="Pipeline database dashboard — feature grid + timeline modal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Pathly Studio — DB Explorer</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../_shell/shell.css">
<style>
  /* ── stats strip ── */
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; padding:0 28px 18px; }
  .stat { background:var(--bg-surface0); border:var(--border); border-radius:var(--radius-lg); padding:14px 16px; }
  .stat .k { font-size:var(--font-size-sm); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); }
  .stat .v { font-family:var(--font-family-mono); font-size:26px; font-weight:500; margin-top:8px; }
  .stat .v.cost { color:var(--green); }

  /* ── feature grid ── */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:0 28px 28px; }
  .feat { background:var(--bg-surface0); border:var(--border); border-radius:var(--radius-lg); padding:16px; cursor:pointer;
    transition:border-color var(--transition-fast), transform var(--transition-fast); }
  .feat:hover { border-color:var(--accent-border); transform:translateY(-1px); }
  .feat .top { display:flex; align-items:center; justify-content:space-between; }
  .feat .fname { font-family:var(--font-family-mono); font-size:var(--font-size-md); font-weight:500; color:var(--text-primary); }
  .dots { display:flex; gap:5px; margin:14px 0; }
  .dots span { height:7px; border-radius:99px; }
  .feat .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .feat .mk { font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); }
  .feat .mv { font-family:var(--font-family-mono); font-size:15px; margin-top:3px; }
  .feat .mv.cost { color:var(--green); }
  .feat .foot { display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
  .feat .ts { font-family:var(--font-family-mono); font-size:var(--font-size-sm); color:var(--text-muted); }

  /* ── state pill (shared look) ── */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:var(--radius-full);
    font-size:var(--font-size-sm); font-weight:600; letter-spacing:0.04em; line-height:1; border:1px solid; }
  .pill .pdot { width:7px; height:7px; border-radius:50%; }

  /* ── progress ── */
  .prog { display:flex; align-items:center; gap:8px; width:96px; }
  .prog .track { flex:1; height:6px; background:var(--bg-surface1); border-radius:99px; overflow:hidden; }
  .prog .fill { height:100%; border-radius:99px; }
  .prog .frac { font-family:var(--font-family-mono); font-size:var(--font-size-sm); color:var(--text-muted); }

  /* ── header action buttons ── */
  .btn-b { display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:var(--radius-md);
    border:var(--border); background:var(--bg-mantle); color:var(--text-secondary);
    font:500 var(--font-size-sm)/1 var(--font-family-base); cursor:pointer; white-space:nowrap;
    transition:background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast); }
  .btn-b:hover { background:var(--btn-b-hover-bg); border-color:var(--accent); color:var(--accent); }

  /* ── modal ── */
  .overlay { position:fixed; inset:0; background:rgba(3,5,12,0.6); backdrop-filter:blur(2px);
    display:none; align-items:flex-start; justify-content:center; padding:64px 24px; z-index:100; }
  .overlay[data-open] { display:flex; }
  .modal { width:860px; max-width:100%; max-height:calc(100vh - 128px); display:flex; flex-direction:column;
    background:var(--bg-base); border:var(--border); border-radius:var(--radius-xl); box-shadow:var(--shadow-modal); overflow:hidden; }
  .m-head { display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:var(--border-subtle); }
  .m-name { font-family:var(--font-family-mono); font-size:var(--font-size-md); font-weight:600; }
  .m-meta { font-size:var(--font-size-base); color:var(--text-muted); }
  .m-meta b { font-family:var(--font-family-mono); color:var(--green); font-weight:500; }
  .m-close { margin-left:auto; }
  .m-actions { display:flex; align-items:center; gap:8px; padding:14px 18px; }
  .m-runner { margin-left:auto; font-family:var(--font-family-mono); font-size:var(--font-size-sm); color:var(--text-muted); }
  .m-runner b { color:var(--green); }
  .m-tabs { display:flex; gap:20px; padding:0 18px; border-bottom:var(--border); }
  .m-tab { display:inline-flex; align-items:center; gap:6px; padding:0 0 10px; margin-bottom:-1px; border:none; background:transparent;
    color:var(--text-muted); font:500 var(--font-size-base)/1 var(--font-family-base); cursor:pointer;
    border-bottom:2px solid transparent; }
  .m-tab[data-active] { color:var(--text-primary); font-weight:600; border-bottom-color:var(--accent); }
  .m-tab .ct { font-family:var(--font-family-mono); font-size:var(--font-size-xs); padding:1px 5px; border-radius:99px; background:var(--bg-surface1); color:var(--text-muted); }
  .m-tab[data-active] .ct { background:var(--accent-bg); color:var(--accent); }
  .m-body { padding:18px; overflow:auto; }
  .m-sublabel { font-size:var(--font-size-sm); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin:0 0 16px; }

  /* timeline */
  .timeline { display:flex; align-items:flex-start; gap:6px; overflow-x:auto; padding-bottom:14px; }
  .tstep { display:flex; flex-direction:column; align-items:flex-start; min-width:96px; }
  .tstamp { font-family:var(--font-family-mono); font-size:var(--font-size-xs); color:var(--text-muted); margin-top:8px; }
  .tdur { font-family:var(--font-family-mono); font-size:var(--font-size-xs); color:var(--text-secondary); margin-top:3px; }
  .tarrow { color:var(--text-disabled); align-self:center; margin-top:4px; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; padding-top:14px; border-top:var(--border-subtle); }
  .legend span { display:inline-flex; align-items:center; gap:6px; font-size:var(--font-size-sm); color:var(--text-secondary); }
  .legend i { width:9px; height:9px; border-radius:50%; }

  /* agents */
  .agents { display:flex; flex-direction:column; gap:10px; }
  .arow { display:grid; grid-template-columns:150px 1fr 56px; align-items:center; gap:14px; }
  .aname { font-size:var(--font-size-base); color:var(--text-secondary); }
  .aname .conv { color:var(--text-muted); }
  .abar { height:22px; border-radius:var(--radius-sm); }
  .acost { font-family:var(--font-family-mono); font-size:var(--font-size-base); color:var(--green); text-align:right; }
</style>
</head>
<body>
  <div class="app">
    <div id="pathly-topbar"></div>
    <div class="app-body">
      <div id="pathly-sidebar"></div>
      <main class="app-main">
        <div class="page-head" style="display:flex; align-items:flex-start; justify-content:space-between; gap:20px;">
          <div>
            <h1 class="page-title">DB Explorer</h1>
            <p class="page-sub">Pipeline databases · <code>pathly/plans/*/pathly.db</code> · FSM server <code>127.0.0.1:8765</code></p>
          </div>
          <div class="head-actions" id="head-actions"></div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script>window.PATHLY_SHELL = { project:'fsm-server-sqlite', activeNav:null, activeSide:'db' };</script>
  <script src="../../assets/vendor/icons.js"></script>
  <script src="../_shell/shell.js"></script>
  <script src="db-explorer.js"></script>
</body></html>
