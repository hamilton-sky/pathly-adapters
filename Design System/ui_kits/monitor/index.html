<!-- @dsCard group="Monitor" viewport="1280x760" name="Monitor" subtitle="Live FSM pipeline view" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Pathly Studio — Monitor</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../_shell/shell.css">
<link rel="stylesheet" href="monitor.css">
</head>
<body>
  <div class="app">
    <div id="pathly-topbar"></div>
    <div class="app-body">
      <div id="pathly-sidebar"></div>
      <main class="app-main">
        <div class="mon">
          <div class="mon-head">
            <span class="mon-topic">auth-refactor</span>
            <span id="head-pill"></span>
            <span class="live"><span class="ld"></span>SSE live</span>
          </div>
          <div class="conv-label" id="conv-label"></div>
          <div class="stepper" id="stepper"></div>
          <div class="metrics" id="metrics"></div>
          <div class="vtabs" id="vtabs"></div>
          <div class="evwrap">
            <div class="evtitle"><span>Event Log</span><button class="evtoggle">all phases</button></div>
            <div class="evlog" id="evlog"></div>
            <div class="evtotals"><span class="lbl">in/out</span><span class="val">48.8k&#8593;&nbsp;&nbsp;16.0k&#8595;</span><span class="sum">= 64.8k combined &#8593;</span></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="overlay" id="overlay"><div class="pmodal" id="pmodal"></div></div>
  <script>window.PATHLY_SHELL = { project:'fsm-server-sqlite', activeNav:'monitor', activeSide:'monitor' };</script>
  <script src="../../assets/vendor/icons.js"></script>
  <script src="../_shell/shell.js"></script>
  <script src="monitor.js"></script>
</body></html>
