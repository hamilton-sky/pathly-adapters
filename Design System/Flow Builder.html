<style>
  body { margin: 0; background: var(--bg-base); }

  .scr { width: 100%; height: 100%; background: var(--bg-base); color: var(--text-primary);
    font-family: var(--font-family-base); display: flex; flex-direction: column; overflow: hidden; }

  /* top bar */
  .top { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--bg-mantle); border-bottom: var(--border); }
  .top .bk { color: var(--text-muted); display: inline-flex; cursor: pointer; }
  .top .flow { display: flex; align-items: center; gap: 8px; }
  .top .flbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .top .fname { font-family: var(--font-family-mono); font-size: 13px; color: var(--text-primary);
    background: var(--bg-surface0); border: var(--border); border-radius: var(--radius-md); padding: 5px 10px; }
  .top .tabs { display: flex; gap: 2px; margin-left: 10px; }
  .top .tab { font-size: 12px; padding: 5px 12px; border-radius: var(--radius-md); color: var(--text-muted); cursor: pointer; }
  .top .tab.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }
  .top .sp { flex: 1; }
  .top .hostbtn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary);
    background: var(--bg-surface0); border: var(--border); border-radius: var(--radius-md); padding: 6px 10px; cursor: pointer; }
  .top .hostbtn .cv { color: var(--text-muted); display: inline-flex; }
  .top .save { font-size: 12px; font-weight: 600; color: #fff; background: var(--accent); border: none;
    border-radius: var(--radius-md); padding: 7px 14px; cursor: pointer; }

  .work { flex: 1; display: flex; min-height: 0; }

  /* canvas */
  .cv { flex: 1; position: relative; overflow: hidden; min-width: 0;
    background-color: var(--bg-base);
    background-image: radial-gradient(color-mix(in srgb, var(--text-muted) 18%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
    display: flex; flex-direction: column; align-items: center; padding: 30px 24px; gap: 0; overflow-y: auto; }
  .node { width: 320px; box-sizing: border-box; border: var(--border); border-left: 4px solid var(--c);
    border-radius: var(--radius-md); background: var(--bg-surface0); padding: 11px 14px; cursor: pointer; position: relative;
    transition: box-shadow var(--transition-fast), border-color var(--transition-fast); }
  .node.sel { border-color: var(--accent-border); box-shadow: 0 0 0 2px var(--accent-bg); }
  .node .nrow { display: flex; align-items: center; gap: 10px; }
  .node .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .node .nn { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; flex: 1; }
  .node .agent { font-family: var(--font-family-mono); font-size: 11px; color: var(--text-muted); }
  .node .chips { display: flex; align-items: center; gap: 12px; margin-top: 7px; padding-left: 20px; }
  .node .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); font-family: var(--font-family-mono); }
  .node .chip .ic { display: inline-flex; }
  .conn { width: 2px; height: 22px; background: var(--border-color); }
  .conn.re { position: relative; background: color-mix(in srgb, var(--orange) 55%, transparent); }
  .conn.re::after { content: '↩ reroute'; position: absolute; left: 10px; top: 4px; font-size: 10px;
    font-family: var(--font-family-mono); color: var(--orange); white-space: nowrap; }
  .addn { width: 320px; box-sizing: border-box; margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    color: var(--accent); font-size: 13px; font-weight: 600; border: 1.5px dashed var(--accent-border);
    border-radius: var(--radius-md); padding: 10px; background: transparent; cursor: pointer; }

  /* inspector */
  .insp { width: 330px; flex-shrink: 0; border-left: var(--border); background: var(--bg-mantle);
    padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .insp .ihead { display: flex; align-items: center; gap: 9px; }
  .insp .ihead .pip { width: 10px; height: 10px; border-radius: 50%; }
  .insp .ihead .it { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
  .ctrl { background: var(--bg-base); border: var(--border); border-radius: var(--radius-md); padding: 8px 10px;
    font-size: 13px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
  .ctrl.mono { font-family: var(--font-family-mono); }
  .ctrl.sel { justify-content: space-between; color: var(--text-secondary); cursor: pointer; }
  .ctrl.sel .cv { color: var(--text-muted); display: inline-flex; }
  .ctrl .ic { display: inline-flex; }
  .prompt { background: var(--bg-base); border: var(--border); border-radius: var(--radius-md); padding: 9px 11px;
    font-size: 12px; line-height: 1.5; color: var(--text-secondary); height: 58px; overflow: hidden; }
  .prompt b { color: var(--text-primary); font-weight: 600; }
  .gate { display: flex; align-items: center; gap: 10px; }
  .toggle { width: 34px; height: 20px; border-radius: 999px; background: var(--green); position: relative; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .gtxt { font-family: var(--font-family-mono); font-size: 12px; color: var(--text-secondary); }
  .trans { display: flex; flex-direction: column; gap: 7px; }
  .trans .tr { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .trans .tk { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); width: 52px; flex-shrink: 0; }
  .trans .tv { font-family: var(--font-family-mono); color: var(--text-primary); }
  .trans .tv.re { color: var(--orange); }
  .ilink { font-size: 12px; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 2px; }

  /* monitor inspector screen */
  .mon { flex: 1; display: flex; min-height: 0; }
  .mlist { width: 300px; flex-shrink: 0; border-right: var(--border); background: var(--bg-mantle); padding: 8px 0; overflow-y: auto; opacity: 0.55; }
  .mhead { padding: 10px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .mhead .accent { color: var(--accent); display: inline-flex; }
  .stagerow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-left: 2px solid transparent; font-size: 13px; color: var(--text-secondary); }
  .stagerow.on { border-left-color: var(--accent); background: var(--bg-surface0); color: var(--text-primary); opacity: 1; }
  .stagerow .sd { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .stagerow .snm { flex: 1; font-weight: 600; }
  .stagerow .scost { font-family: var(--font-family-mono); font-size: 10px; color: var(--text-muted); }
  .mfill { flex: 1; position: relative; background: var(--bg-base); min-width: 0;

  .rpanel { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: var(--bg-mantle); border-left: var(--border);

  .rp-head { padding: 14px 16px; border-bottom: var(--border); }
  .rp-titlerow { display: flex; align-items: center; gap: 9px; }
  .rp-stage { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .rp-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--font-family-mono);

  .rp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; }
  .rp-meta { display: flex; gap: 14px; margin-top: 9px; font-family: var(--font-family-mono); font-size: 12px; color: var(--text-muted); }
  .rp-close { margin-left: auto; color: var(--text-muted); cursor: pointer; display: inline-flex; }
  .rp-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .rp-sec { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .rp-result { background: var(--bg-base); border: var(--border); border-radius: var(--radius-md); padding: 11px; font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); }
  .rp-result b { color: var(--text-primary); }
  .rp-tok { font-family: var(--font-family-mono); font-size: 11px; color: var(--text-muted); }
  .rp-gate { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .rp-gate .gk { color: var(--green); display: inline-flex; }
  .rp-gate .gm { font-family: var(--font-family-mono); color: var(--text-secondary); }
  .rp-trans { font-family: var(--font-family-mono); font-size: 12.5px; color: var(--text-primary); display: flex; align-items: center; gap: 7px; }
  .rp-prompt { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .rp-foot { border-top: var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .rp-act { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); cursor: pointer; }
  .rp-act.muted { color: var(--text-secondary); }
  .ic { display: inline-flex; flex-shrink: 0; }

  /* ── transition rules (routing) ── */
  .rules { width: 100%; height: 100%; background: var(--bg-mantle); color: var(--text-primary);
    font-family: var(--font-family-base); display: flex; flex-direction: column; overflow: hidden; }
  .rules .rhead { padding: 16px 20px 13px; border-bottom: var(--border); }
  .rules .rtitle { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .rules .rtitle .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--state-reviewing); }
  .rules .rsub { font-size: 13px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; max-width: 600px; }
  .rules .rsub code { font-family: var(--font-family-mono); color: var(--text-secondary); }
  .rbody { flex: 1; overflow-y: auto; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
  .rule { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 9px; border: var(--border);
    border-radius: var(--radius-lg); background: var(--bg-surface0); padding: 14px 16px; position: relative; }
  .rule .num { position: absolute; left: -9px; top: -9px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--bg-surface1); border: var(--border); color: var(--text-muted); font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-family-mono); }
  .kw { font-size: 12px; color: var(--text-muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    border: var(--border); background: var(--bg-base); font-size: 12.5px; font-family: var(--font-family-mono);
    color: var(--text-primary); cursor: pointer; }
  .pill .cv { color: var(--text-muted); display: inline-flex; }
  .pill .ic { display: inline-flex; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pill.cond { border-color: color-mix(in srgb, var(--yellow) 45%, transparent);
    color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, transparent); }
  .pill.cond .ic { color: var(--yellow); }
  .rule .del { margin-left: auto; color: var(--text-muted); display: inline-flex; cursor: pointer; }
  .addrule { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; color: var(--accent);
    font-size: 13px; font-weight: 600; border: 1.5px dashed var(--accent-border); border-radius: var(--radius-md);
    padding: 9px 14px; background: transparent; cursor: pointer; }
  .defrow { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border: var(--border);
    border-radius: var(--radius-lg); background: var(--bg-base); }
  .defrow .kw.b { font-weight: 600; color: var(--text-secondary); }
</style>

          <div className="field"><label>Prompt</label><div className="prompt"><b>BUILDING stage.</b> Implement the planned change. Keep the diff focused; run the gate before you hand off to review.</div></div>
          <div className="field"><label>Quality gate</label><div className="gate"><span className="toggle"></span><span className="gtxt">lint · type · test</span></div></div>
          <div className="field"><label>Transitions</label>
            <div className="trans">
              <div className="tr"><span className="tk">On pass</span><Ico n="arrow-left" s={13} /><span className="tv">REVIEWING</span></div>
              <div className="tr"><span className="tk">On fail</span><span className="tv re">↩ BUILDING (reroute)</span></div>
            </div>
          </div>
          <span className="ilink"><Ico n="external-link" s={13} />Open build.md in Notebook</span>
        </aside>
      </div>
    </div>
  );
}

const STAGES = [
  { n: 'PLANNING', col: 'var(--state-planning)', host: 'claude', cost: '$0.31', st: 'ok' },
  { n: 'BUILDING', col: 'var(--state-building)', host: 'claude', cost: '$1.97', st: 'ok' },
  { n: 'REVIEWING', col: 'var(--state-reviewing)', host: 'codex', cost: '$0.74', st: 'ok', on: true },
  { n: 'TESTING', col: 'var(--state-testing)', host: 'codex', cost: '—', st: 'pending' },
  { n: 'DONE', col: 'var(--state-done)', host: '—', cost: '—', st: 'idle' },
];

function MonitorInspector() {
  return (
    <div className="scr">
      <div className="top">
        <div className="flow"><span className="flbl" style={{ color: 'var(--accent)' }}><Ico n="activity" s={15} /></span><span className="fname" style={{ background: 'none', border: 'none', padding: 0 }}>Monitor · fsm-sqlite</span></div>
        <span className="sp"></span>
        <span className="hostbtn">conv 1 · live</span>
      </div>
      <div className="mon">
        <div className="mlist">
          <div className="mhead"><span className="accent"><Ico n="activity" s={13} /></span>State machine</div>
          {STAGES.map((s) => (
            <div className={'stagerow' + (s.on ? ' on' : '')} key={s.n}>
              <span className="sd" style={{ background: s.st === 'pending' ? 'var(--text-muted)' : s.st === 'idle' ? 'var(--bg-surface1)' : 'var(--green)' }}></span>
              <span className="snm">{s.n}</span>
              <span className="scost">{s.cost}</span>
            </div>
          ))}
        </div>
        <div className="mfill">
          <div className="rpanel">
            <div className="rp-head">
              <div className="rp-titlerow">
                <span className="rp-stage">REVIEWING</span>
                <span className="rp-pill"><Brand n="codex" s={13} />codex</span>
                <span className="rp-dot"></span>
                <span className="rp-close"><Ico n="x" s={15} /></span>
              </div>
              <div className="rp-meta"><span>4.2s</span><span>$0.74</span><span>reviewer</span></div>
            </div>
            <div className="rp-body">
              <div className="field"><label>CLI host</label><div className="ctrl sel"><span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><Brand n="codex" s={16} />Codex</span><span className="cv"><Ico n="chevron-down" s={14} /></span></div></div>
              <div className="field"><label>Agent</label><div className="ctrl sel">reviewer<span className="cv"><Ico n="chevron-down" s={14} /></span></div></div>
              <div className="field"><label>Skill</label><div className="ctrl sel">review.md<span className="cv"><Ico n="chevron-down" s={14} /></span></div></div>
              <div className="field"><label>Prompt</label><div className="prompt"><b>REVIEWING stage.</b> Check the diff against the plan. Flag any missing branch and require a passing test before you hand off.</div></div>
              <div className="field"><label>Quality gate</label><div className="gate"><span className="toggle"></span><span className="gtxt">lint · type · test</span></div></div>
              <div className="field"><label>Transitions</label>
                <div className="trans">
                  <div className="tr"><span className="tk">On pass</span><span className="tv">TESTING</span></div>
                  <div className="tr"><span className="tk">On fail</span><span className="tv re">↩ BUILDING (reroute)</span></div>
                </div>
              </div>
              <div className="rp-tok" style={{ marginTop: '2px' }}>last run · 4.2s · $0.74 · in 18,402 / out 3,118 · gate passed</div>
            </div>
            <div className="rp-foot">
              <span className="rp-act"><Ico n="check" s={14} />Apply &amp; re-run stage</span>
              <span className="rp-act muted"><Ico n="external-link" s={14} />Open review.md in Notebook</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PillState({ n, c }) {
  return <span className="pill"><span className="dot" style={{ background: c }}></span>{n}<span className="cv"><Ico n="chevron-down" s={12} /></span></span>;
}
function Pill({ icon, n, cls }) {
  return <span className={'pill' + (cls ? ' ' + cls : '')}>{icon && <span className="ic"><Ico n={icon} s={12} /></span>}{n}<span className="cv"><Ico n="chevron-down" s={12} /></span></span>;
}
function TransitionRules() {
  const rules = [
    { cond: 'REVIEW_FAILURES.md', state: 'BUILDING', sc: 'var(--state-building)', agent: 'builder', skill: 'fixing.md' },
    { cond: 'SCOPE_VIOLATION.md', state: 'PLANNING', sc: 'var(--state-planning)', agent: 'planner', skill: 'plan.md' },
  ];
  return (
    <div className="rules">
      <div className="rhead">
        <div className="rtitle"><span className="pip"></span>Routing · REVIEWING</div>
        <div className="rsub">When work leaves <code>REVIEWING</code>, Pathly checks these rules top-down. The matching artifact is carried to the target agent.</div>
      </div>
      <div className="rbody">
        {rules.map((r, i) => (
          <div className="rule" key={i}>
            <span className="num">{i + 1}</span>
            <span className="kw">if</span>
            <span className="pill cond"><span className="ic"><Ico n="file-text" s={12} /></span>{r.cond}<span className="cv"><Ico n="chevron-down" s={12} /></span></span>
            <span className="kw">route back to</span>
            <PillState n={r.state} c={r.sc} />
            <span className="kw">· agent</span>
            <Pill icon="brain" n={r.agent} />
            <span className="kw">· skill</span>
            <Pill icon="diamond" n={r.skill} />
            <span className="del"><Ico n="x" s={14} /></span>
          </div>
        ))}
        <button className="addrule" type="button">＋ Add rule</button>
        <div className="defrow"><span className="kw b">Otherwise →</span><PillState n="TESTING" c="var(--state-testing)" /><span className="kw">the happy path, no reroute</span></div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="builder" title="Flow Builder" subtitle="The 6-step wizard, redesigned — add states on a canvas, configure each in the inspector">
        <DCArtboard id="fb" label="Builder — per-state CLI host, agent, skill, prompt, gate & transitions" width={1080} height={660}><FlowBuilder /></DCArtboard>
        <DCPostIt top={20} left={1110} width={210}>Wizard steps → one canvas. Name = top bar · States = nodes · Agents / CLI / Gates / Transitions = the inspector · YAML = a tab.</DCPostIt>
      </DCSection>

      <DCSection id="rules" title="Transition rules" subtitle="Reroute on condition — pick the artifact, target state, agent & skill in one readable rule">
        <DCArtboard id="tr" label="Routing editor — when REVIEWING fails, where does it go & who fixes it" width={760} height={470}><TransitionRules /></DCArtboard>
        <DCPostIt top={20} left={790} width={208}>One rule replaces wizard Step 3 + 6 + 7 — transitions, feedback routing, and artifact conditions.</DCPostIt>
      </DCSection>

      <DCSection id="monitor" title="Monitor · click a node" subtitle="Inline config — click a node to edit its CLI host, agent, skill, prompt & gate right there, then apply & re-run">
        <DCArtboard id="mi" label="Inline config panel — edit CLI host / agent / skill / prompt / gate in place" width={1080} height={660}><MonitorInspector /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
