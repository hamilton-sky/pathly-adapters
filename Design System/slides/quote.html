<!-- @dsCard group="Slides" viewport="1280x720" name="Quote slide" subtitle="Large statement on chrome" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { width:1280px; height:720px; box-sizing:border-box; position:relative; overflow:hidden;
    background:var(--bg-base); color:var(--text-primary); font-family:var(--font-family-base);
    padding:110px; display:flex; flex-direction:column; justify-content:center; }
  .bar { width:64px; height:5px; background:var(--accent); border-radius:99px; margin-bottom:40px; }
  blockquote { margin:0; font-size:52px; line-height:1.22; font-weight:600; letter-spacing:-0.015em; max-width:1000px; text-wrap:balance; }
  blockquote .acc { color:var(--accent); }
  .by { display:flex; align-items:center; gap:14px; margin-top:48px; }
  .by .av { width:44px; height:44px; border-radius:var(--radius-md); background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; }
  .by .who { display:flex; flex-direction:column; }
  .by .name { font-size:20px; font-weight:600; }
  .by .role { font-size:17px; color:var(--text-muted); }
  .mark { position:absolute; right:96px; bottom:84px; width:120px; height:120px; opacity:0.12; }
</style></head>
<body>
  <div class="slide">
    <div class="bar"></div>
    <blockquote>"We stopped guessing what our agents were doing. Now the whole pipeline is <span class="acc">visible, replayable, and costed</span> — stage by stage."</blockquote>
    <div class="by">
      <span class="av">SH</span>
      <span class="who"><span class="name">Shammai Hamilton</span><span class="role">Maintainer · Pathly</span></span>
    </div>
    <img class="mark" src="../assets/logo-mark.svg" alt="">
  </div>
</body></html>
