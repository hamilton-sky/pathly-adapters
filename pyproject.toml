[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathly-adapters"
version = "2.20.0"
description = "Pathly adapter installer â€” stitches and deploys agent files to AI host tools."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0,<7", "flask>=2.3,<4", "sqlite-vec==0.1.6", "sentence-transformers>=2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build", "twine", "jsonschema>=4", "black==26.5.1", "mypy==2.1.0"]

[project.scripts]
pathly-setup = "install_cli.__main__:main"
pathly-tokens = "pathly_telemetry.report:main"
pathly-events = "pathly_orchestrator.eventlog:_cli"
pathly-state = "pathly_orchestrator.eventlog:_state_cli"
pathly-fsm-http = "pathly_orchestrator.http_server:main"
pathly-fsm-call = "pathly_orchestrator.fsm_cli:main"
pathly-validate-flow = "pathly_orchestrator.fsm.state:validate_flow_cli"
pathly-run = "pathly_orchestrator.runner:main"
pathly-status = "pathly_orchestrator.cli.status:main"
pathly-log = "pathly_orchestrator.cli.log:main"
pathly-back = "pathly_orchestrator.cli.back:main"
pathly-ff   = "pathly_orchestrator.cli.ff:main"
pathly-studio = "pathly_studio_cli.install:main"
pathly-design = "pathly_data.core.design.cli:main"
pathly-otel-export = "pathly_orchestrator.otel_export:cli_main"

[tool.black]
# Pin the formatting target to the project's minimum Python so `black --check`
# is deterministic regardless of the runner's interpreter. The black version is
# pinned exactly in the dev extra above so CI never drifts on a new release.
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "slow: marks tests as slow (E2E installs)",
    "no_pathly_autouse: skip Pathly DB/server autouse fixtures for pure contract tests",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["install_cli*", "pathly_telemetry*", "pathly_data*", "pathly_orchestrator*", "pathly_hooks*", "pathly_studio_cli*"]

[tool.setuptools.package-data]
"pathly_data" = [
    "core/**/*",
    "core/design/data/**/*",
    "core/design/scripts/**/*",
    "adapters/**/*",
    "adapters/claude/.claude-plugin/*",
    "adapters/codex/.codex-plugin/*",
    "schemas/*.json",
]

[tool.bandit]
exclude_dirs = ["tests", "src/pathly_data"]
skips = ["B603", "B607"]
