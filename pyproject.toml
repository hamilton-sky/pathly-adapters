[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathly-adapters"
version = "2.24.1"
description = "Pathly adapter installer â€” stitches and deploys agent files to AI host tools."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0,<7", "flask>=2.3,<4", "sqlite-vec==0.1.6", "sentence-transformers>=2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build", "twine", "jsonschema>=4", "black==26.5.1", "mypy==2.1.0", "import-linter==2.14"]

[project.scripts]
pathly-setup = "install_cli.__main__:main"
pathly-tokens = "pathly_telemetry.report:main"
pathly-events = "pathly_orchestrator.eventlog:_cli"
pathly-state = "pathly_orchestrator.eventlog:_state_cli"
pathly-fsm-http = "pathly_orchestrator.http_server:main"
pathly-fsm-call = "pathly_orchestrator.fsm_cli:main"
pathly-validate-flow = "pathly_orchestrator.fsm.state:validate_flow_cli"
pathly-run = "pathly_orchestrator.runner:main"
pathly-pty-host = "pathly_orchestrator.pty_host.cli:main"
pathly-status = "pathly_orchestrator.cli.status:main"
pathly-log = "pathly_orchestrator.cli.log:main"
pathly-back = "pathly_orchestrator.cli.back:main"
pathly-ff   = "pathly_orchestrator.cli.ff:main"
pathly-studio = "pathly_studio_cli.install:main"
pathly-design = "pathly_data.core.design.cli:main"
pathly-otel-export = "pathly_orchestrator.otel_export:cli_main"

[tool.black]
# Pin the formatting target to the project's minimum Python so `black --check`
# is deterministic regardless of the runner's interpreter. The black version is
# pinned exactly in the dev extra above so CI never drifts on a new release.
target-version = ["py311"]

[tool.importlinter]
# CLAUDE.md's "Layer dependency rule (no upward imports)" as a CI gate — was documentation
# only ("Imports that violate this direction are architecture bugs, not style issues") with
# nothing checking it, exactly the pattern the 400-line ratchet existed to fix for file size.
# `db/ -> runner/ -> supervisor/ -> http_server/`: a lower layer may never import a higher one.
root_package = "pathly_orchestrator"

[[tool.importlinter.contracts]]
name = "Orchestrator layer rule (db -> runner -> supervisor -> http_server)"
type = "layers"
layers = [
    "pathly_orchestrator.http_server",
    "pathly_orchestrator.supervisor",
    "pathly_orchestrator.runner",
    "pathly_orchestrator.db",
]
# Pre-existing violations, all routed through shared top-level hub modules OUTSIDE the four
# layers (eventlog.py, fsm_http_client.py, board_mirror.py) rather than a layer package
# importing another layer package directly. Frozen exceptions, same spirit as
# scripts/file_size_baseline.txt: documented and pinned so the gate is meaningful for new
# code without requiring an unrelated deep refactor to land it. Fixing these is real,
# separate work — do not add to this list; a NEW layer violation should fail the gate.
ignore_imports = [
    "pathly_orchestrator.db.migrations -> pathly_orchestrator.board_mirror",
    "pathly_orchestrator.runner -> pathly_orchestrator.fsm_http_client",
    "pathly_orchestrator.eventlog -> pathly_orchestrator.http_server.sse",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" so pathly_* import; "." (repo root) so `from tests._paths import …` resolves under
# bare `pytest` (CI). Without the repo root, only `python -m pytest` (which prepends CWD) works.
pythonpath = ["src", "."]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "slow: marks tests as slow (E2E installs)",
    "no_pathly_autouse: skip Pathly DB/server autouse fixtures for pure contract tests",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["install_cli*", "pathly_telemetry*", "pathly_data*", "pathly_orchestrator*", "pathly_hooks*", "pathly_studio_cli*"]

[tool.setuptools.package-data]
"pathly_data" = [
    "core/**/*",
    "core/design/data/**/*",
    "core/design/scripts/**/*",
    "adapters/**/*",
    "adapters/claude/.claude-plugin/*",
    "adapters/codex/.codex-plugin/*",
    "schemas/*.json",
]

[tool.bandit]
exclude_dirs = ["tests", "src/pathly_data"]
skips = ["B603", "B607"]
